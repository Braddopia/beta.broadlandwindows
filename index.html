/* ---------------- Smart Orders import (CSV with column mapping) ---------------- */
const OF=[['ref','Order number'],['cust','Customer'],['desc','Product'],['due','Due date'],['status','Status'],['sup','Supplier (optional)']];
const OPAT={ref:/order|ref|number|no\.?$|id/,due:/due|deliver|ship|install|date/,status:/status|stage|state/,cust:/customer|client|name|site|account/,desc:/product|desc|item|style|type/,sup:/supplier|vendor|manufactur/};
const csvP=(t,d)=>{const r=[];let row=[],c='',qq=0;for(let i=0;i<t.length;i++){const x=t[i];if(qq){if(x=='"'&&t[i+1]=='"'){c+='"';i++}else if(x=='"')qq=0;else c+=x}else if(x=='"')qq=1;else if(x==d){row.push(c);c=''}else if(x=='\n'||x=='\r'){if(x=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=x}row.push(c);r.push(row);return r.filter(r=>r.some(v=>v.trim()))};
const ordDate=v=>{v=(v||'').trim();let m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m)return SAFE.date((m[3].length==2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'));m=v.match(/^\d{4}-\d{2}-\d{2}/);if(m)return SAFE.date(m[0]);const x=new Date(v);return isNaN(x)?'':iso(x)};
let ordRows=null;
function ordImport(){openModal(`<h2>Import Smart Orders</h2><p class="muted">Upload the order export (CSV) or paste the table. The next step lets you check which column is which.</p><div class="ff full"><label class="btn ghost sm" style="cursor:pointer">Choose CSV file<input type="file" accept=".csv,.tsv,.txt" hidden onchange="ordFile(this)"></label></div><div class="ff full"><textarea id="ordTxt" rows="8" placeholder="Or paste here, first row = column headings"></textarea></div><div class="mact"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="ordNext()">Next</button></div>`)}
function ordFile(inp){const f=inp.files[0];if(!f)return;if(f.size>5e6){toast('That file is too large');return}f.text().then(t=>{$('#ordTxt').value=t})}
function ordNext(){const t=$('#ordTxt').value.trim();if(!t){toast('Nothing to import');return}
  ordRows=csvP(t,t.split('\n')[0].includes('\t')?'\t':',').slice(0,5001);const H=ordRows[0],hl=H.map(h=>h.toLowerCase()),sv=S.ordMap||{},same=sv.h==H.join('|'),used=new Set();
  const pick=k=>{let i=same&&sv[k]!=null?sv[k]:-2;if(i==-2){i=hl.findIndex((h,j)=>!used.has(j)&&OPAT[k].test(h));if(i<0&&k=='ref')i=0}if(i>=0)used.add(i);return i};
  const opt=i=>`<option value="-1">- none -</option>`+H.map((h,j)=>`<option value="${j}"${j==i?' selected':''}>${esc(h||'Column '+(j+1))}</option>`).join('');
  openModal(`<h2>Check The Columns</h2><div class="grid">${OF.map(([k,l])=>`<div class="ff"><label>${l}</label><select id="om_${k}" onchange="ordPrev()">${opt(pick(k))}</select></div>`).join('')}<div class="ff full"><label>Supplier for all orders (when no supplier column)</label><select id="om_dsup" onchange="ordPrev()">${sups().map(x=>`<option${/smart/i.test(x.name)?' selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><h3>Preview</h3><div id="om_prev"></div><div class="mact"><button class="btn ghost" onclick="ordImport()">Back</button><button class="btn" onclick="ordGo()">Import</button></div>`,'lg');ordPrev()}
function ordBuild(){const c={};OF.forEach(([k])=>c[k]=+$('#om_'+k).value);const g=(r,k)=>c[k]>=0?SAFE.text(r[c[k]],120):'',d=$('#om_dsup').value;return ordRows.slice(1).map(r=>({ref:g(r,'ref'),customer:g(r,'cust'),desc:g(r,'desc'),due:ordDate(g(r,'due')),status:g(r,'status'),supplier:g(r,'sup')||d})).filter(o=>o.ref||o.customer)}
function ordPrev(){$('#om_prev').innerHTML=ordBuild().slice(0,3).map(o=>`<div class="row"><span><b>${esc(o.ref)}</b> ${esc(o.customer)}<br><span class="muted">${esc(o.desc)}, ${o.due?fd(o.due):'no date'}, ${esc(o.status||'no status')}, ${esc(o.supplier)}</span></span></div>`).join('')||'<p class="empty">Nothing found, check the columns.</p>'}
function ordGo(){const O=ordBuild();if(!O.length){toast('Nothing found, check the columns');return}S.ordMap={h:ordRows[0].join('|')};OF.forEach(([k])=>S.ordMap[k]=+$('#om_'+k).value);S.orders=O;ordSync();audit('Orders imported','Smart Orders',O.length+' orders');store();closeModal();render();toast(O.length+' orders imported')}
function ordSync(){S.deliveries=S.deliveries.filter(d=>!d.so);S.orders.forEach(o=>{if(!o.due)return;S.deliveries.push({id:'SO-'+o.ref,supplier:o.supplier||'Smart Systems',items:(o.desc||'Smart order')+(o.customer?', '+o.customer:''),contract:o.ref,due:o.due,status:ORDDONE.test(o.status)?'Received':'Due',stage:o.status||'Ordered',so:1})})}
function ordClear(){if(!confirm('Clear imported orders?'))return;S.orders=[];ordSync();audit('Orders cleared','Smart Orders','');store();render()}

/* ==========================================================================
   07 · Sales & service: leads, contracts, service calls, contact book
   ========================================================================== */
const nid=(p,a)=>p=='S'?'S-'+String(Math.max(0,...a.map(x=>parseInt(String(x.id).split('-')[1])||0))+1).padStart(4,'0'):String(Math.max(p=='C'?2400000:1000,...a.map(x=>parseInt(x.id)||0))+1);
function del(k,id){if(k=='staff'&&!need(ISOWN,'Removing staff'))return;if(k=='fin'&&!need(ISADM,'Deleting bills'))return;
  if(!confirm('Delete '+id+"? This can't be undone."))return;S[k]=S[k].filter(x=>x.id!=id);audit('Deleted',k+' '+id,'');store();closeModal();render()}

/* ---------------- leads ---------------- */
function vLeads(){const tot=sum(S.leads.filter(l=>!['Won','Lost'].includes(l.stage)),l=>l.value);
  return `<div class="head"><h1>Leads</h1><div class="tools"><span class="muted">Open pipeline ${m0(tot)}</span><button class="btn" onclick="editLead()">New lead</button></div></div>
  <div class="kan">${STAGES.map(s=>{const L=S.leads.filter(l=>l.stage==s&&hit(l));return `<div class="col"><div class="colh"><b>${s}</b><span>${L.length} leads, ${m0(sum(L,l=>l.value))}</span></div>${L.map(l=>`<div class="lc"><div class="lt"><b ${A('openLead',l.id)} title="Open lead">${esc(l.name)} <small class="muted">#${esc(l.id)}</small></b><span>${m0(l.value)}</span></div><p>${esc(l.product)}</p><p class="muted">${esc(l.town)}, via ${esc(l.source)}</p><p class="muted">${esc(l.next||'No next step set')}</p>${phCount(l.photos)}<div class="lb"><button class="mini" aria-label="Move back" ${A('mvLead',l.id,-1)}>&lsaquo;</button><button class="mini" aria-label="Move forward" ${A('mvLead',l.id,1)}>&rsaquo;</button><button class="mini" ${A('editLead',l.id)}>Edit</button>${l.stage=='Won'&&!l.contract?`<button class="mini pri" ${A('toContract',l.id)}>Create contract</button>`:''}</div></div>`).join('')||'<p class="empty">Nothing here.</p>'}</div>`}).join('')}</div>`}
function mvLead(id,d){const l=S.leads.find(x=>x.id==id),i=STAGES.indexOf(l.stage)+d;if(i<0||i>=STAGES.length)return;const a=l.stage;l.stage=STAGES[i];(l.log=l.log||[]).unshift({d:today(),t:'Stage: '+a+' to '+l.stage,by:USER});store();render()}
function editLead(id){const l=S.leads.find(x=>x.id==id);
  form(l?'Edit Lead':'New Lead',[{k:'name',l:'Customer',req:1},{k:'phone',l:'Phone',t:'tel',max:30},{k:'town',l:'Town'},{k:'value',l:'Quote value (£)',t:'number'},{k:'product',l:'Product',w:'full'},{k:'source',l:'Source',t:'select',o:SOURCES},{k:'stage',l:'Stage',t:'select',o:STAGES},{k:'next',l:'Next step',w:'full'}],l||{stage:'New',source:'Website'},o=>{if(l)Object.assign(l,o);else S.leads.push({id:nid('L',S.leads),...o});audit(l?'Lead edited':'Lead added',o.name,'')},true)}
function toContract(id){const l=S.leads.find(x=>x.id==id);if(!l)return;l.contract=true;const c={id:nid('C',S.contracts),name:l.name,town:l.town,product:l.product,value:l.value,paid:0,stage:'Deposit due',fit:'',fitter:FIT[0],phone:l.phone,lead:l.id,notes:'From lead '+l.id,photos:(l.photos||[]).slice(),pay:[]};S.contracts.unshift(c);audit('Contract created',c.id,'From lead '+l.id);store();toast('Contract created from '+l.id);go('contracts')}
function openLead(id){const l=S.leads.find(x=>x.id==id);if(!l)return;l.log=l.log||[];
  const p=l.prob||({New:10,Surveyed:30,Quoted:55,Won:100,Lost:0})[l.stage],od=l.followup&&l.followup<today();
  const rows=[['Phone',l.phone?`<a href="tel:${esc(l.phone)}">${esc(l.phone)}</a>`:'-'],['Email',l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`:'-'],['Town',esc(l.town)],['Product',esc(l.product)],['Source',esc(l.source)],['Owner',esc(l.owner||'Unassigned')],['Quote value',money(l.value)],['Win chance',p+'%, worth '+money(l.value*p/100)],['Follow-up',l.followup?fd(l.followup)+(od?' <span class="tag r">Overdue</span>':''):'Not set'],['Next step',esc(l.next||'-')]];
  openModal(`<button class="mx" onclick="closeModal()" aria-label="Close">&times;</button><h2>${esc(l.name)} <span class="tag">${esc(l.stage)}</span></h2><div class="bar2"><i style="width:${p}%"></i></div>${rows.map(([a,b])=>`<div class="row"><span class="muted">${a}</span><b>${b}</b></div>`).join('')}<h3>Activity</h3>${l.log.map(e=>`<div class="row"><span><b>${esc(e.t)}</b><br><span class="muted">${esc(e.n||'')}</span></span><span class="muted">${fd(e.d)}<br>${esc(e.by||'')}</span></div>`).join('')||'<p class="empty">No activity yet.</p>'}${gallery(l.photos)}<div class="mact"><button class="btn ghost" ${A('leadNote',id)}>Log activity</button><button class="btn ghost" ${A('leadMeta',id)}>Update details</button><button class="btn" onclick="closeModal()">Close</button></div>`)}
function leadNote(id){const l=S.leads.find(x=>x.id==id);form('Log Activity',[{k:'type',l:'Type',t:'select',o:['Call','Email','Visit','Quote sent','Note']},{k:'followup',l:'Next follow-up',t:'date'},{k:'n',l:'What happened',t:'area',w:'full'}],{type:'Call',followup:l.followup||''},o=>{(l.log=l.log||[]).unshift({d:today(),t:o.type,n:o.n,by:USER});if(o.followup)l.followup=o.followup;setTimeout(()=>openLead(id),60)})}
function leadMeta(id){const l=S.leads.find(x=>x.id==id);form('Lead Details',[{k:'email',l:'Email',t:'email',w:'full'},{k:'owner',l:'Owner',t:'select',o:['Unassigned',...FIT]},{k:'prob',l:'Win chance (%)',t:'number',max:100,dp:0},{k:'followup',l:'Follow-up date',t:'date'},{k:'next',l:'Next step',w:'full'}],l,o=>{Object.assign(l,o);setTimeout(()=>openLead(id),60)})}

/* ---------------- contracts ---------------- */
const CK=['Survey booked','Survey done','Quote signed','Deposit received','Materials ordered','Delivery received','Fit booked','Fitted','Snagging clear','Final payment','Guarantee issued'];
const stTag=s=>`<span class="tag ${s=='Complete'||s=='Fitted'?'g':s=='Deposit due'?'y':''}">${esc(s)}</span>`;
function ckpi(L){const v=sum(L,c=>c.value),p=sum(L,c=>c.paid),wc=L.filter(c=>c.cost),mg=wc.length?Math.round(100*(1-sum(wc,c=>c.cost)/sum(wc,c=>c.value))):'-';
  return `<div class="kpis">${[['Contracts',L.length],['Total value',m0(v)],['Collected',m0(p)],['Outstanding',m0(v-p)],...(ISADM()?[['Avg margin',mg=='-'?'-':mg+'%']]:[])].map(k=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div>`}
function vContracts(){const L=S.contracts.filter(hit),tv=sum(L,c=>c.value),bal=sum(L,c=>c.value-c.paid);
  return `<div class="head"><h1>Contracts</h1><div class="tools"><span class="muted">${m0(tv)} total, ${m0(bal)} still to collect</span><button class="btn" onclick="editContract()">New contract</button></div></div>
  ${ckpi(L)}<div class="tw"><table><thead><tr><th>Ref</th><th>Customer</th><th class="c-md">Product</th><th class="n">Value</th><th class="n c-sm">Paid</th><th>Stage</th><th class="c-sm">Fit date</th><th class="c-md">Fitter</th><th class="ac"></th></tr></thead><tbody>
  ${L.map(c=>{const p=c.value?Math.min(100,Math.round(100*c.paid/c.value)):0;return `<tr><td><b style="cursor:pointer;color:var(--blue)" ${A('openContract',c.id)}>${esc(c.id)}</b></td><td>${esc(c.name)}<br><span class="muted">${esc(c.town)}</span></td><td class="c-md">${esc(c.product)} ${phCount(c.photos)}</td><td class="n">${m0(c.value)}</td><td class="n c-sm">${m0(c.paid)}<div class="bar"><i style="width:${p}%"></i></div></td><td>${stTag(c.stage)}</td><td class="c-sm">${fd(c.fit)}</td><td class="c-md">${esc(c.fitter)}</td><td class="ac"><div class="acts r"><button class="mini pri" ${A('openContract',c.id)}>Open</button><button class="mini" ${A('editContract',c.id)}>Edit</button><button class="mini c-md" ${A('reportContract',c.id)}>Report</button><button class="mini del" ${A('del','contracts',c.id)}>Delete</button></div></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No contracts match.</td></tr>'}
  </tbody></table></div>`}
function editContract(id){const c=S.contracts.find(x=>x.id==id);
  form(c?'Edit '+c.id:'New Contract',[{k:'name',l:'Customer',req:1},{k:'town',l:'Town'},{k:'product',l:'Product',w:'full'},{k:'value',l:'Contract value (£)',t:'number'},{k:'paid',l:'Paid so far (£)',t:'number'},{k:'stage',l:'Stage',t:'select',o:CSTAGES},{k:'fit',l:'Fit date',t:'date'},{k:'fitter',l:'Fitter',t:'select',o:FIT},{k:'phone',l:'Phone',t:'tel',max:30},{k:'email',l:'Email',t:'email'},{k:'address',l:'Address',w:'full',max:200},...(ISADM()?[{k:'cost',l:'Job cost (£)',t:'number'}]:[]),{k:'survey',l:'Survey date',t:'date'},{k:'order',l:'Order date',t:'date'},{k:'notes',l:'Notes',t:'area',w:'full'}],c||{stage:'Deposit due',fitter:FIT[0]},o=>{
    if(o.paid>o.value&&o.value>0&&!confirm('Paid is more than the contract value. Save anyway?'))return false;
    if(c)Object.assign(c,o);else S.contracts.unshift({id:nid('C',S.contracts),pay:[],...o});audit(c?'Contract edited':'Contract added',c?c.id:o.name,'')},true)}
function reportContract(id,mode){const c=S.contracts.find(x=>x.id==id);if(!c)return;
  if(!mode){docChoice('Contract '+c.id,'reportContract('+JSON.stringify(id)+',"c")','reportContract('+JSON.stringify(id)+',"i")');return}
  if(mode=='c'){const bal=c.value-c.paid;
    printDoc('Your Contract Summary',c.product,[['Contract number',c.id],['Product',c.product],['Installation address',c.address||c.town||'-'],['Survey date',fd(c.survey)],['Fitting date',c.fit?fdl(c.fit):'To be confirmed'],['Fitting team',c.fitter||'To be confirmed']],[],
      {customer:{name:c.name,address:c.address||c.town,contact:USER},kind:'Contract Summary',ref:'CON-'+c.id,kpis:[['Contract value',money(c.value)],['Paid to date',money(c.paid)],['Balance remaining',money(bal)]],
       tables:(c.pay||[]).length?[{t:'Payments received',h:['Date','Method','Amount'],r:c.pay.map(p=>[fdl(p.date),p.method,money(p.amt)])}]:[],
       thanks:bal>0?'The remaining balance of '+money(bal)+' is due before or on completion. If you have any questions, just call us.':'Your contract is fully paid. Thank you!'});return}
  printDoc('Contract '+c.id,c.name,[['Contract No.',c.id],['Customer',c.name],['Phone',c.phone||'-'],['Email',c.email||'-'],['Address',c.address||c.town],['Product',c.product],...(ISADM()?[['Job Cost',money(c.cost)],['Margin',c.cost&&c.value?Math.round(100*(c.value-c.cost)/c.value)+'%':'n/a']]:[]),['Survey / Order',fd(c.survey)+' / '+fd(c.order)],['Fit Date',fd(c.fit)],['Fitter',c.fitter],['Checklist',CK.filter(k=>(c.chk||{})[k]).length+' of '+CK.length+' done'],['Notes',c.notes||'-']],c.photos,{kind:'Contract Sheet',ref:'CON-'+c.id,kpis:[['Value',money(c.value)],['Paid',money(c.paid)],['Balance',money(c.value-c.paid)],['Stage',c.stage]],tables:(c.pay||[]).length?[{t:'Payments',h:['Date','Method','Note','Amount'],r:c.pay.map(p=>[fd(p.date),p.method,p.note||'',money(p.amt)])}]:[],barcode:c.id})}
function openContract(id){const c=S.contracts.find(x=>x.id==id);if(!c)return;c.pay=c.pay||[];c.chk=c.chk||{};
  const idx=CSTAGES.indexOf(c.stage),led=sum(c.pay,p=>p.amt),old=c.paid-led,mg=c.cost&&c.value?Math.round(100*(c.value-c.cost)/c.value)+'%':'Not set';
  const info=[['Customer',esc(c.name)],['Phone',c.phone?`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:'-'],['Email',c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'-'],['Address',esc(c.address||c.town)],['Product',esc(c.product)],['Survey / Order',fd(c.survey)+' / '+fd(c.order)],['Fit date',fd(c.fit)],['Fitter',esc(c.fitter)],...(ISADM()?[['Margin',mg]]:[]),['Notes',esc(c.notes||'-')]];
  openModal(`<button class="mx" onclick="closeModal()" aria-label="Close">&times;</button><h2>Contract ${esc(c.id)} ${stTag(c.stage)}</h2><div class="stp">${CSTAGES.map((x,i)=>`<span class="${i<=idx?'on':''}"><i>${i<idx?'&#10003;':i+1}</i>${esc(x)}</span>`).join('')}</div>
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">${[['Value',m0(c.value)],['Paid',m0(c.paid)],['Balance',m0(c.value-c.paid)]].map(k=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div>
  ${info.map(([a,b])=>`<div class="row"><span class="muted">${a}</span><b>${b}</b></div>`).join('')}
  <h3>Payments</h3>${old>0?`<div class="row"><span class="muted">Earlier payments</span><b>${money(old)}</b></div>`:''}${c.pay.map(p=>`<div class="row"><span>${fd(p.date)} <span class="muted">${esc(p.method)} ${esc(p.note||'')}</span></span><b>${money(p.amt)}</b></div>`).join('')||(old>0?'':'<p class="empty">No payments logged.</p>')}
  <div id="ckw">${ckHtml(c)}</div>${gallery(c.photos)}
  <div class="mact"><button class="btn green sm" ${A('addPay',c.id)}>Add payment</button><button class="btn ghost sm" ${A('editContract',c.id)}>Edit</button><button class="btn ghost sm" ${A('reportContract',c.id)}>Report</button><button class="btn ghost sm" ${A('editCall',null,c.id)}>Service call</button><button class="btn sm" onclick="closeModal()">Close</button></div>`,'lg')}
const ckHtml=c=>{const n=CK.filter(k=>c.chk[k]).length;return `<h3>Job Checklist, ${n} of ${CK.length} Done</h3><div class="bar2"><i style="width:${Math.round(100*n/CK.length)}%"></i></div>${CK.map(k=>`<label class="row" style="cursor:pointer"><span>${esc(k)}</span><input type="checkbox" ${c.chk[k]?'checked':''} ${AC('onchange','ckTog',c.id,k,'this.checked')}></label>`).join('')}`};
function ckTog(id,k,v){const c=S.contracts.find(x=>x.id==id);c.chk[k]=v;store();$('#ckw').innerHTML=ckHtml(c)}
function addPay(id){if(!need(ISADM,'Recording payments'))return;const c=S.contracts.find(x=>x.id==id);
  form('Add Payment',[{k:'amt',l:'Amount (£)',t:'number',req:1,pos:1},{k:'date',l:'Date',t:'date',req:1},{k:'method',l:'Method',t:'select',o:['Bank transfer','Card','Cheque','Cash','Finance']},{k:'note',l:'Note'}],{date:today(),method:'Bank transfer',amt:Math.max(0,c.value-c.paid)},o=>{c.pay.push({amt:o.amt,date:o.date,method:o.method,note:o.note});c.paid=Math.round((c.paid+o.amt)*100)/100;audit('Payment recorded',c.id,money(o.amt)+' '+o.method);setTimeout(()=>openContract(id),60)})}
function markFit(id){const c=S.contracts.find(x=>x.id==id);c.stage='Fitted';audit('Marked fitted',id,'');store();render();toast('Contract '+id+' marked as fitted')}

/* ---------------- service calls ---------------- */
function vService(){const L=S.calls.filter(hit).sort((a,b)=>(a.status=='Complete')-(b.status=='Complete')||['Urgent','Normal','Low'].indexOf(a.priority)-['Urgent','Normal','Low'].indexOf(b.priority));
  return `<div class="head"><h1>Service Calls</h1><div class="tools"><button class="btn" onclick="editCall()">New service call</button></div></div>
  <div class="tw"><table><thead><tr><th>Ref</th><th>Customer</th><th>Issue</th><th>Priority</th><th>Status</th><th class="c-sm">Visit</th><th class="c-md">Fitter</th><th class="ac"></th></tr></thead><tbody>
  ${L.map(c=>`<tr><td><b>${esc(c.id)}</b><br><span class="muted">${esc(c.contract)}</span></td><td>${esc(c.name)}<br><span class="muted">${esc(c.town)}</span></td><td>${esc(c.issue)} ${phCount(c.photos)}</td><td>${prTag(c.priority)}</td><td><span class="tag ${c.status=='Complete'?'g':c.status=='Booked'?'':'y'}">${esc(c.status)}</span></td><td class="c-sm">${fd(c.visit)}</td><td class="c-md">${esc(c.fitter)}</td><td class="ac"><div class="acts r"><button class="mini" ${A('editCall',c.id)}>Edit</button><button class="mini" ${A('reportCall',c.id)}>Report</button><button class="mini del" ${A('del','calls',c.id)}>Delete</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No service calls match.</td></tr>'}
  </tbody></table></div>`}
function editCall(id,cid){const c=S.calls.find(x=>x.id==id),k=S.contracts.find(x=>x.id==cid)||{};if(cid)go('service');

function holSet(id,st){if(!need(ISOWN,'Approving holiday'))return;const h=S.hols.find(x=>x.id==id);if(!h)return;h.status=st;audit('Holiday '+st.toLowerCase(),staffName(h.sid),h.from+' to '+h.to);store();render()}

(function migratePhotos(){S.pphotos=S.pphotos||{};S.items.forEach(r=>{if(r.photos&&r.photos.length){const a=S.pphotos[r.pid]=S.pphotos[r.pid]||[];r.photos.forEach(p=>{if(SAFE.img(p)&&!a.includes(p)&&a.length<MAX_PHOTOS)a.push(p)})}delete r.photos})})();

  const val={pid:r=>r.pid,item:r=>r.item,length:r=>r.length,colours:colTxt,unit:unitOf,location:r=>hasLoc(r)?r.location:'~',stock:r=>+r.stock,reorder:ro,supplier:r=>r.supplier||'~',cost:r=>+r.cost,value:r=>r.stock*r.cost,status:r=>r.stock<=0?0:isLow(r)?1:2}[I.sort]||(r=>r.item);

  <div class="kpis">${K.map(kpi).join('')}</div>

  ${n?`<div class="selbar"><b>${n} Selected</b><button class="mini pri" ${A('invBatch','add')}>Add Stock</button><button class="mini" ${A('invBatch','remove')}>Remove Stock</button><button class="mini" ${A('invSetF','location')}>Set Location</button><button class="mini" ${A('invSetF','supplier')}>Set Supplier</button><button class="mini" ${A('invSetF','unit')}>Set Unit</button><button class="mini" onclick="invRep()">Report</button><button class="mini" onclick="invLabels()">Labels</button><button class="mini" ${A('invCsv',1)}>Export</button>${ISOWN()?'<button class="mini del" onclick="invDel()">Delete</button>':''}<button class="mini" onclick="SEL.clear();render()">Clear</button></div>`:''}
  <div class="tw"><table class="ptb"><thead><tr><th><input type="checkbox" aria-label="Select all on this page" ${pg.rows.length&&pg.rows.every(r=>SEL.has(key(r)))?'checked':''} ${AC('onchange','invAll','this.checked')}></th>${thS('inv','pid','ID')}${thS('inv','item','Item')}${thS('inv','length','Length','c-sm')}${thS('inv','colours','Colours','c-md')}${thS('inv','unit','Unit')}${thS('inv','location','Location','c-md')}${thS('inv','stock','Stock','n')}${thS('inv','reorder','Reorder','n c-md')}${thS('inv','supplier','Supplier','c-sm')}${thS('inv','cost','Cost','n c-sm')}${Ad?thS('inv','value','Value','n c-md'):''}<th class="ac"><span class="srt" ${A('sortBy','inv','status')} style="cursor:pointer;margin-right:.5rem">Status${UI.inv.sort=='status'?`<span class="ar">${UI.inv.dir>0?'▲':'▼'}</span>`:''}</span><button class="fbtn ${filtersOn?'on':''}" id="invF" title="Sort and filter" aria-label="Sort and filter" onclick="invFilter(this)">${svg(IC.filter)}</button></th></tr></thead><tbody>${rows||`<tr><td colspan="15" class="empty">No products match.</td></tr>`}</tbody></table></div>
  ${pagerH('inv',pg,'products')}

/* selection + batch tools */
function invSel(k,on){on?SEL.add(k):SEL.delete(k);render()}
function invAll(on){paginate(UI.inv,invFiltered()).rows.forEach(r=>on?SEL.add(key(r)):SEL.delete(key(r)));render()}
function moveRow(b,kind,qty,stock,extra){return{...b,at:Date.now(),time:nowT(),type:kind,flag:false,cleared:false,uid:uuid(),user:USER,qty,stock,reqStatus:undefined,ord:undefined,pref:undefined,note:undefined,...(extra||{})}}
function invBatch(kind){form((kind=='add'?'Add Stock To ':'Remove Stock From ')+SEL.size+' Items',[{k:'qty',l:'Quantity for each item',t:'number',req:1,pos:1,w:'full',max:1e6}],{qty:1},o=>{
  SEL.forEach(k=>{const b=prod(k);if(!b)return;const st=kind=='add'?b.stock+o.qty:Math.max(0,b.stock-o.qty);prodRows(k).forEach(x=>x.stock=st);S.items.unshift(moveRow(b,kind,o.qty,st))});audit('Batch '+kind,SEL.size+' products','Qty '+o.qty+' each')})}

function invNewRun(){const lines=$('#bn').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).slice(0,2000),ok=[],bad=[];
  lines.forEach((l,i)=>{const c=l.split(/\t|,/).map(x=>SAFE.text(x,60));if(i==0&&/^item/i.test(c[0]))return;const[item,q,cost,sup,loc,len,ci,co,un]=c,qty=SAFE.num(q,{max:1e6}),cs=SAFE.num(cost,{max:1e6});
    if(!SAFE.code(item)||!(qty>0)||!(cs>0)||!sup){bad.push(i+1);return}const unit=UNITS.find(u=>u.toLowerCase()==String(un||'').toLowerCase())||'Each';ok.push({item:SAFE.code(item),qty,cost:cs,supplier:sup,location:loc||'',length:len||'-',cInName:ci||'-',cOutName:co||'-',unit})});
  if(bad.length){toast('Check line'+(bad.length>1?'s ':' ')+bad.slice(0,8).join(', ')+': item, quantity, cost and supplier are required');return}if(!ok.length){toast('Nothing to add');return}

    S.items.unshift({at:Date.now(),time:nowT(),type:'add',flag:false,uid:uuid(),pid,user:USER,qty:o.qty,unit:o.unit,item:o.item,length:o.length,cInName:o.cInName,cIn:hex(o.cInName),cOutName:o.cOutName,cOut:hex(o.cOutName),stock:st,cost:o.cost,location:o.location||(ex?ex.location:'-'),barcode:ex?ex.barcode:'',supplier:o.supplier,reorder:ex&&ex.reorder,lead:ex&&ex.lead})});
  audit('Batch add',ok.length+' products','');store();closeModal();render();toast(ok.length+' product'+(ok.length>1?'s':'')+' added')}

let scanCb=null,scanning=false,stream=null,reader=null,lastScan={c:'',t:0};

  scanCb=cb;$('#scanner').classList.add('open');$('#manual').value='';$('#scanMsg').textContent='Point the camera at a barcode.';

  else{try{await loadZX();stream.getTracks().forEach(t=>t.stop());stream=null;reader=new ZXing.BrowserMultiFormatReader();reader.decodeFromVideoDevice(null,'vid',r=>{if(r)got(r.getText())})}
    catch(e){$('#scanMsg').textContent='Scanner library could not load. Type the code below instead.'}}}

function got(raw){
  const code=SAFE.code(raw);
  if(!code){$('#scanMsg').textContent='That code has characters we cannot use. Letters, numbers, spaces, dots, dashes and slashes only.';return}
  if(code==lastScan.c&&Date.now()-lastScan.t<1500)return;   /* ignore double reads */
  lastScan={c:code,t:Date.now()};stopScan();if(navigator.vibrate)navigator.vibrate(60);

const C39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn'};
function c39(t,h){const s='*'+String(t).toUpperCase().replace(/[^0-9A-Z\-. ]/g,'-').slice(0,40)+'*';let x=0,r='';
  for(const ch of s){const p=C39[ch];for(let i=0;i<9;i++){const w=p[i]=='w'?3:1;if(i%2==0)r+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w}x+=1}x-=1;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 ${x+20} ${h}" width="${(x+20)*.8}" height="${h*.8}" fill="#000" shape-rendering="crispEdges">${r}</svg>`}

/* rows: [[label,value]...]  o: {kind, ref, kpis, tables:[{t,h,r}], sections:[{t,kpis,bars,tables}], pre, post, sign, barcode,
   customer:{name,address} -> customer-facing layout (no internal data, friendly close) } */
function printDoc(t,sub,rows,ph,o){o=o||{};rows=(rows||[]).filter(Boolean);ph=(ph||[]).filter(SAFE.img);const cus=!!o.customer;
  const w=window.open('','_blank');if(!w){toast('Allow pop-ups to open reports');return}
  const now=new Date(),date=now.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),ref=o.ref||'BW-'+iso(now).slice(2).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
  const isN=v=>typeof v=='number'||/^[£\-]?[\d,]+(\.\d+)?%?$/.test(String(v).trim());
  const tb=x=>`<h3>${esc(x.t)}</h3><table class="dt"><thead><tr>${x.h.map((h,i)=>`<th class="${x.r.length&&isN(x.r[0][i])?'n':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${x.r.map(r=>`<tr>${r.map(c=>`<td class="${isN(c)?'n':''}">${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${x.h.length}" class="e">Nothing to show</td></tr>`}</tbody></table>`;
  const kp=k=>k&&k.length?`<div class="kp">${k.map(x=>`<div><small>${esc(x[0])}</small><b>${esc(x[1])}</b>${x[2]?`<small>${esc(x[2])}</small>`:''}</div>`).join('')}</div>`:'';
  const bars=b=>{const mx=Math.max(1,...b.rows.map(r=>+r[1]||0));return `<h3>${esc(b.t)}</h3><div class="bl">${b.rows.map(r=>`<span>${esc(r[0])}</span><div class="pb"><i style="width:${Math.round(100*(+r[1]||0)/mx)}%"></i></div><b>${esc(r[2](r[1]))}</b>`).join('')}</div>`};
  const secs=(o.sections||[]).map(s=>`<h2 class="sec">${esc(s.t)}</h2>${kp(s.kpis)}${(s.bars||[]).map(bars).join('')}${(s.tables||[]).map(tb).join('')}`).join('');
  const body=`${kp(o.kpis)}${rows.length?`<h3>${cus?'Summary':'Details'}</h3><div class="dg">${rows.map(r=>`<div><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}</div>`:''}${o.pre||''}${(o.tables||[]).map(tb).join('')}${secs}${o.post||''}${ph.length?`<h3>Photos</h3><div class="ph">${ph.map((p,i)=>`<figure><img src="${p}"><figcaption>Photo ${i+1}</figcaption></figure>`).join('')}</div>`:''}`;
  const page=cus
    ?`<header class="lh"><img src="${LOGO_SRC.blue}" alt="Broadland Windows"><h1 class="tl">${esc(t)}</h1>${sub?`<p class="st">${esc(sub)}</p>`:''}</header>
      <div class="pf"><div class="who"><small>Prepared for</small><b>${esc(o.customer.name||'Customer')}</b>${o.customer.address?`<br>${esc(o.customer.address)}`:''}</div><div class="doc"><small>${esc(o.kind||'Document')}</small><span><i>Date</i>${date}</span><span><i>Reference</i>${esc(ref)}</span>${o.customer.contact?`<span><i>Your contact</i>${esc(o.customer.contact)}</span>`:''}</div></div>
      <div class="c">${body}${o.sign?'<div class="sg"><div>Customer signature</div><div>For Broadland Windows</div></div>':''}
      <div class="ty"><div><b>Thank you for choosing Broadland Windows</b><p>${esc(o.thanks||'If you have any questions about this document, our team is always happy to help.')}</p></div><div class="ct">${esc(CO.tel)}<br>${esc(CO.em)}<br>${esc(CO.web)}</div></div></div>`
    :`<div class="top"><img src="${LOGO_SRC.blue}" alt="Broadland"><span class="int">Internal · not for customers</span></div>
      <div class="hero"><div><span class="chip">${esc(o.kind||'Report')}</span><h1>${esc(t)}</h1>${sub?`<p>${esc(sub)}</p>`:''}</div><div class="mg"><div><b>Reference</b>${esc(ref)}</div><div><b>Date</b>${date}</div><div><b>Prepared by</b>${esc(USER)}</div><div><b>Account</b>${esc(ROLES[ROLE].n)}</div></div></div>
      <div class="c">${body}${o.sign?'<div class="sg"><div>Prepared by</div><div>Checked by</div><div>Date</div></div>':''}${o.barcode?`<div class="bcode">${c39(o.barcode,48)}<div>${esc(String(o.barcode).toUpperCase())}</div><small>Scan to look up in Broadland CRM</small></div>`:''}</div>`;
  const foot=cus?`<span>Broadland Windows, Doors &amp; Garden Rooms<br>${esc(CO.addr)}</span><span class="m">${esc(CO.tel)} &middot; ${esc(CO.em)}<br>${esc(CO.web)}</span><span class="r">${esc(ref)}</span>`

  <div class="tb"><button onclick="print()">Print or save as PDF</button><button onclick="close()">Close</button></div><div class="pg">${page}</div><footer class="ft">${foot}</footer></body></html>`);w.document.close()}

function reportProd(k){const rows=prodRows(k);if(!rows.length)return;const r=rows[0],Ad=ISADM(),sp=S.suppliers.find(s=>s.name==r.supplier)||{},bc=r.barcode||r.item,[sl]=stt(r),u=unitOf(r);
  const ins=sum(rows.filter(x=>x.type=='add'),x=>x.qty),outs=sum(rows.filter(x=>x.type=='remove'),x=>x.qty),reqs=rows.filter(x=>x.type=='request');
  printDoc(r.item,[r.length,colTxt(r)].filter(x=>x&&x!='-').join(', '),[['Item Code',r.item],['Stock ID',r.pid],['Unit',u],['Length',r.length],['Colour In (B)',r.cInName],['Colour Out (A)',r.cOutName],['Location',hasLoc(r)?r.location:'Not set'],['Supplier',r.supplier||'Not set'],['Supplier Contact',[sp.contact,sp.phone,sp.email].filter(Boolean).join(', ')||'-'],['Reorder Level',ro(r)],['Reorder Quantity',r.reorderQty||'-'],['Lead Time',r.lead?r.lead+' days':'-'],['Total Added',ins+' '+u],['Total Removed',outs+' '+u],...(Ad?[['Cost Each',money(r.cost)]]:[]),['Notes',r.notes||'-']],pphotos(k),
    {kind:'Stock Report',ref:'STK-'+r.pid,sign:true,barcode:bc,kpis:[['In Stock',r.stock+' '+u],['Status',sl=='OK'?'In Stock':sl=='Low'?'Reorder Now':'Out Of Stock'],...(Ad?[['Stock Value',money(r.stock*r.cost)]]:[]),['Movements',rows.length]],
     tables:[{t:'Movement History',h:['Time','Type','Order No.','User','Qty','Stock After'],r:rows.filter(x=>x.type!='request').slice(0,25).map(x=>[x.time,x.type,'-',x.user,x.qty,x.stock]).concat([])},...(reqs.length?[{t:'Requests',h:['Time','Order No.','Status','User','Qty','Note'],r:reqs.slice(0,15).map(x=>[x.time,x.ord||'-',x.reqStatus||'-',x.user,x.qty+' '+unitOf(x),x.note||''])}]:[])]})}
function invRep(k){if(k){reportProd(k);return}const n=SEL.size;
  openModal(`<h2>Inventory Reports</h2><div class="rl">${[['sel','Selected Items ('+n+')',n],['all','Full Stock List',1],['low','Low Stock And Reorder',1],['out','Out Of Stock',1],['sup','By Supplier',1],['loc','By Location',1],['req','Stock Requests',1]].map(([c,t,e])=>`<button class="rb" ${e?'':'disabled'} ${A('invRun',c)}><b>${t}</b></button>`).join('')}</div><div class="ff" style="margin-top:.8rem"><label class="cbl"><input type="checkbox" id="rhist" checked> Include movement history</label><label class="cbl"><input type="checkbox" id="rphoto"> Include photos</label></div><div class="mact"><button class="btn ghost" onclick="closeModal()">Close</button></div>`)}
function invRun(sc){const Ad=ISADM(),P=products().sort((a,b)=>a.item.localeCompare(b.item)),hist=$('#rhist').checked,ph=$('#rphoto').checked,ref='INV-'+today().replace(/-/g,'')+'-'+sc.toUpperCase();
  let L=P,title='Stock Report',sub='Full stock list';
  if(sc=='sel'){L=P.filter(r=>SEL.has(key(r)));title='Selected Items';sub=L.length+' selected items'}else if(sc=='low'){L=P.filter(isLow);title='Low Stock And Reorder';sub='Items below their reorder level'}else if(sc=='out'){L=P.filter(r=>r.stock<=0);title='Out Of Stock';sub='Items with no stock'}else if(sc=='sup'){title='Stock By Supplier';sub='Grouped by supplier'}else if(sc=='loc'){title='Stock By Location';sub='Grouped by location'}
  closeModal();

  const hd=['ID','Item','Length','Colours','Location','Stock','Unit','Reorder','Supplier',...(Ad?['Cost','Value']:[])],row=r=>[r.pid,r.item,r.length,colTxt(r),hasLoc(r)?r.location:'-',r.stock,unitOf(r),ro(r),r.supplier||'-',...(Ad?[money(r.cost),money(r.stock*r.cost)]:[])];

function vFinance(){if(!ISADM())return '<p class="empty">Finance is for administrators only.</p>';
  const td=today(),F=UI.fin,deb=S.contracts.filter(c=>c.value-c.paid>0),owed=sum(deb,c=>c.value-c.paid),bills=S.fin.filter(b=>b.status=='Unpaid'),n=new Date(),mo=new Date(n.getFullYear(),n.getMonth()+F.pm,1),mk=iso(mo).slice(0,7),pr=sum(S.staff,x=>x.salary/12),paid=S.pay[mk]||{},Own=ISOWN();

  const tabs={
    debtors:`<div class="tw"><table><thead><tr><th>Contract</th><th>Customer</th><th class="c-sm">Stage</th><th class="n c-md">Value</th><th class="n c-md">Paid</th><th class="n">Balance</th><th class="ac"></th></tr></thead><tbody>${deb.map(c=>`<tr><td><b>${esc(c.id)}</b></td><td>${esc(c.name)}</td><td class="c-sm">${stTag(c.stage)}</td><td class="n c-md">${m0(c.value)}</td><td class="n c-md">${m0(c.paid)}</td><td class="n"><b>${m0(c.value-c.paid)}</b></td><td class="ac"><div class="acts r"><button class="mini pri" ${A('addPay',c.id)}>Record payment</button>${c.email&&SAFE.email(c.email)?`<a class="mini" href="mailto:${esc(c.email)}?subject=${encodeURIComponent('Balance due on contract '+c.id)}&amp;body=${encodeURIComponent('Hello '+c.name+', our records show '+money(c.value-c.paid)+' is outstanding on contract '+c.id+'. Please let us know when payment will be made. Thank you, Broadland')}">Remind</a>`:''}<button class="mini" ${A('openContract',c.id)}>Open</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nobody owes you anything.</td></tr>'}</tbody></table></div>`,
    payables:`<div class="tw"><table><thead><tr><th>Payee</th><th class="c-md">Type</th><th class="c-sm">Ref</th><th class="c-md">Job</th><th>Due</th><th class="n">Amount</th><th>Status</th><th class="ac"></th></tr></thead><tbody>${S.fin.slice().sort((a,b)=>(a.status=='Paid')-(b.status=='Paid')||a.due.localeCompare(b.due)).map(b=>`<tr><td><b>${esc(b.payee)}</b></td><td class="c-md">${esc(b.type)}</td><td class="c-sm">${esc(b.ref)}</td><td class="c-md">${esc(b.job||'-')}</td><td>${fd(b.due)}</td><td class="n">${money(b.amount)}</td><td><span class="tag ${b.status=='Paid'?'g':b.due<td?'r':'y'}">${b.status=='Paid'?'Paid '+fd(b.paidOn):b.due<td?'Overdue':'Unpaid'}</span></td><td class="ac"><div class="acts r">${b.status=='Unpaid'?`<button class="mini pri" ${A('payBill',b.id)}>Mark paid</button>`:''}<button class="mini" ${A('editBill',b.id)}>Edit</button><button class="mini del" ${A('del','fin',b.id)}>Delete</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No bills.</td></tr>'}</tbody></table></div>`,
    payroll:Own?`<div class="tw"><table><thead><tr><th>Employee</th><th class="c-sm">Role</th><th class="n">Monthly gross</th><th>Status</th><th class="ac"></th></tr></thead><tbody>${S.staff.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="c-sm">${esc(x.role)}</td><td class="n">${money(x.salary/12)}</td><td><span class="tag ${paid[x.id]?'g':'y'}">${paid[x.id]?'Paid '+fd(paid[x.id]):'Due'}</span></td><td class="ac"><button class="mini ${paid[x.id]?'':'pri'}" ${A('payStaff',x.id,mk)}>${paid[x.id]?'Undo':'Mark paid'}</button></td></tr>`).join('')}</tbody></table></div><p class="muted">Gross pay only (annual salary / 12). Tax, NI and pension are not calculated here.</p>`:'<p class="empty">Payroll is visible to administrators only.</p>'};
  return `<div class="head"><h1>Finance</h1><div class="tools">${F.t=='payables'?'<button class="btn" onclick="editBill()">New bill</button>':''}${F.t=='payroll'&&Own?`<button class="btn" ${A('payAll',mk)}>Pay everyone</button>`:''}</div></div>
  <div class="kpis">${K.map(k=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div>
  <div class="chips">${[['debtors','Money owed to us'],['payables','Suppliers & job costs'],['payroll','Employees']].map(([k,t])=>`<button class="chip ${F.t==k?'on':''}" ${A('setUI','fin.t',k)}>${t}</button>`).join('')}${F.t=='payroll'?`<span style="margin-left:auto;display:flex;gap:.4rem;align-items:center"><button class="mini" ${A('setUI','fin.pm',F.pm-1)}>&lsaquo;</button><b>${mo.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button class="mini" ${A('setUI','fin.pm',F.pm+1)}>&rsaquo;</button></span>`:''}</div>${tabs[F.t]}`}
function payBill(id){if(!need(ISADM,'Paying bills'))return;const b=S.fin.find(x=>x.id==id);b.status='Paid';b.paidOn=today();audit('Bill paid',b.payee,money(b.amount)+' '+b.ref);store();render();toast('Marked as paid')}
function payStaff(id,mk){if(!need(ISOWN,'Payroll'))return;S.pay[mk]=S.pay[mk]||{};if(S.pay[mk][id])delete S.pay[mk][id];else S.pay[mk][id]=today();audit('Payroll updated',staffName(id),mk);store();render()}
function payAll(mk){if(!need(ISOWN,'Payroll'))return;S.pay[mk]=S.pay[mk]||{};S.staff.forEach(x=>{S.pay[mk][x.id]=S.pay[mk][x.id]||today()});audit('Payroll paid','Everyone',mk);store();render();toast('Payroll marked as paid')}
function editBill(id){if(!need(ISADM,'Bills'))return;const b=S.fin.find(x=>x.id==id);
  form(b?'Edit Bill':'New Bill',[{k:'payee',l:'Payee',w:'full',req:1},{k:'type',l:'Type',t:'select',o:['Supplier','Job cost','Subcontractor','Utilities','Other']},{k:'ref',l:'Invoice / reference',max:60},{k:'job',l:'Job / contract no.',max:30},{k:'amount',l:'Amount (£)',t:'number',req:1,pos:1,max:1e7},{k:'due',l:'Due date',t:'date',req:1}],b||{type:'Supplier',due:today()},o=>{if(b)Object.assign(b,o);else S.fin.push({id:shortId('B'),status:'Unpaid',...o});audit(b?'Bill edited':'Bill added',o.payee,money(o.amount))})}

  const td=today(),owed=sum(S.contracts,c=>Math.max(0,c.value-c.paid)),bills=S.fin.filter(b=>b.status=='Unpaid'),pr=sum(S.staff,x=>x.salary/12),pend=S.hols.filter(h=>h.status=='Pending'),od=bills.filter(b=>b.due<td),won=S.leads.filter(l=>l.stage=='Won').length,tot=S.leads.length||1,rev=sum(S.contracts,c=>c.value),paid=sum(S.contracts,c=>c.paid),reqs=S.items.filter(r=>r.type=='request'&&r.reqStatus=='Pending');
  let size=0;try{size=(localStorage.getItem(KEY)||'').length}catch(e){}
  const ph=Object.values(S.pphotos).reduce((a,x)=>a+x.length,0),defPins=Object.entries(S.sec.pins).filter(([,p])=>p.def).map(([k])=>ROLES[k].n);
  const AU=UI.audit,pg=paginate(AU,S.audit.filter(hit));
  return `<div class="head"><h1>Admin Console</h1><div class="tools"><button class="btn ghost" onclick="chPin()">Account PINs</button><button class="btn" ${A('go','finance')}>Open finance</button></div></div>
  <div class="kpis">${[['Contract value',m0(rev)],['Collected',m0(paid)],['Owed to us',m0(owed)],['Bills unpaid',m0(sum(bills,b=>b.amount))]].map(k=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div>
  <div class="two">
   <div class="panel"><h2>Stock Requests To Approve</h2>${reqs.map(r=>`<div class="row"><span><b>${ordTag(r)} ${r.qty} ${esc(unitOf(r))} x ${esc(r.item)}</b><br><small class="muted">${esc(r.user)}, ${esc(r.time)}${r.note?', '+esc(r.note):''}</small></span><span class="acts"><button class="mini pri" ${A('reqApprove',r.uid)}>Approve</button><button class="mini del" ${A('reqReject',r.uid)}>Reject</button></span></div>`).join('')||'<p class="empty">No requests waiting.</p>'}</div>
   <div class="panel"><h2>Holiday Requests</h2>${pend.map(h=>`<div class="row"><span><b>${esc(staffName(h.sid))}</b><br><small class="muted">${fd(h.from)} to ${fd(h.to)} (${h.days} days)</small></span><span class="acts"><button class="mini pri" ${A('holSet',h.id,'Approved')}>Approve</button><button class="mini" ${A('holSet',h.id,'Rejected')}>Decline</button></span></div>`).join('')||'<p class="empty">Nothing waiting for approval.</p>'}</div>
   <div class="panel"><h2>Overdue Bills</h2>${od.map(b=>`<div class="row"><span><b>${esc(b.payee)}</b><br><small class="muted">Due ${fd(b.due)}</small></span><b>${money(b.amount)}</b></div>`).join('')||'<p class="empty">No overdue bills.</p>'}</div>
   <div class="panel"><h2>Sales Health</h2><div class="row"><span>Lead win rate</span><b>${Math.round(won/tot*100)}%</b></div><div class="bar"><i style="width:${won/tot*100}%"></i></div><div class="row" style="margin-top:.6rem"><span>Collected vs contract value</span><b>${pc(paid,rev)}</b></div><div class="bar"><i style="width:${rev?paid/rev*100:0}%"></i></div><div class="row" style="margin-top:.6rem"><span>Monthly payroll</span><b>${m0(pr)}</b></div></div>
   <div class="panel"><h2>Security And Data</h2>
    <div class="row"><span>Account PINs<br><small class="muted">${defPins.length?esc(defPins.join(', '))+' still on the default PIN':'All accounts have their own PIN'}</small></span>${defPins.length?'<span class="tag r">Action needed</span>':'<span class="tag g">OK</span>'}</div>
    <div class="row"><span>Idle sign-out<br><small class="muted">Privileged accounts return to Standard user after ${IDLE_MIN} minutes</small></span><span class="tag g">On</span></div>
    <div class="row"><span>Connection<br><small class="muted">${window.isSecureContext?'Secure (https or local file)':'Not secure: use https'}</small></span><span class="tag ${window.isSecureContext?'g':'r'}">${window.isSecureContext?'OK':'Check'}</span></div>
    <div class="row"><span>Browser storage used<br><small class="muted">${ph} product photos stored</small></span><b>${kb(size)} of about 5 MB</b></div>
    <div class="bar"><i style="width:${Math.min(100,size/5e6*100)}%;${size>4e6?'background:var(--red)':''}"></i></div>
    <div class="acts" style="margin-top:.8rem"><button class="mini pri" onclick="chPin()">Change PINs</button><button class="mini" onclick="backupDl()">Download backup</button><label class="mini" style="cursor:pointer">Restore backup<input type="file" accept=".json,application/json" hidden onchange="backupLoad(this)"></label></div></div>
   <div class="panel"><h2>Quick Actions</h2><div class="acts" style="gap:.5rem"><button class="btn ghost" ${A('go','finance')}>Finance</button><button class="btn ghost" ${A('go','staff')}>Staff</button><button class="btn ghost" ${A('go','holidays')}>Holidays</button><button class="btn ghost" ${A('go','reports')}>Reports</button><button class="btn ghost" ${A('setRole','staff')}>Leave admin mode</button></div></div>
  </div>
  <div class="panel" style="margin-top:1rem;padding:0"><h2 style="padding:1rem 1.1rem 0"><span>Audit Trail <span class="muted" style="font:500 .78rem var(--body)">who changed what, and when</span></span><span class="acts"><button class="mini" onclick="auditCsv()">Export CSV</button></span></h2>
   <div class="tw" style="border:0;box-shadow:none;border-radius:0"><table class="audit"><thead><tr><th>When</th><th>Who</th><th class="c-sm">Account</th><th>Action</th><th>Detail</th></tr></thead><tbody>${pg.rows.map(e=>`<tr><td>${new Date(e.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(e.by)}</td><td class="c-sm">${esc((ROLES[e.role]||{}).n||e.role)}</td><td><b>${esc(e.a)}</b></td><td>${esc(e.t)}${e.d?' <span class="muted">'+esc(e.d)+'</span>':''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nothing logged yet. Changes made from now on are recorded here.</td></tr>'}</tbody></table></div><div style="padding:0 1rem 1rem">${pagerH('audit',pg,'entries')}</div></div>`}
function auditCsv(){if(!need(ISOWN,'The audit log'))return;csvDownload('broadland-audit-'+today()+'.csv',[['When','Who','Account','Action','Target','Detail'],...S.audit.map(e=>[new Date(e.at).toISOString(),e.by,e.role,e.a,e.t,e.d])])}
function backupDl(){if(!need(ISOWN,'Backups'))return;audit('Backup downloaded','All data','');store();download('broadland-crm-backup-'+today()+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}));toast('Backup downloaded. Keep it somewhere safe: it contains customer and staff details.')}
function backupLoad(inp){if(!need(ISOWN,'Restoring backups'))return;const f=inp.files[0];inp.value='';if(!f)return;if(f.size>20e6){toast('That file is too large');return}
  f.text().then(t=>{let n;try{n=JSON.parse(t)}catch(e){toast('That is not a valid backup file');return}
    const ok=n&&typeof n=='object'&&['items','leads','contracts','calls','staff'].every(k=>Array.isArray(n[k]));if(!ok){toast('That file is not a Broadland CRM backup');return}
    if(!confirm('Replace ALL current data with this backup? Your current data is kept as a safety copy in this browser.'))return;
    try{localStorage.setItem(KEY+'_before_restore',JSON.stringify(S))}catch(e){}
    try{localStorage.setItem(KEY,JSON.stringify(n))}catch(e){toast('Not enough browser storage to restore');return}
    location.reload()})}

/* ==========================================================================
   14 · Notification centre: stock requests, alerts, stock in/out, mentions
   ========================================================================== */
const NCTABS=['All','Requests','Stock In/Out','Alerts','Mentions'];
let ncAlerts=[];
function ncData(){const td=today(),req=[],mov=[],alr=[];
  S.items.forEach(r=>{if(r.type=='request'){if(['Pending','Approved'].includes(r.reqStatus)&&!r.cleared)req.push(r)}else{mov.push({r,n:!S.seen[r.uid]});if(r.flag&&!r.cleared)alr.push({k:'Alert',t:r.item+': '+r.type+' '+r.qty,s:r.user+', '+r.time,uid:r.uid})}});
  products().forEach(r=>{const k='low:'+r.pid;if(isLow(r)&&S.dis[k]!==r.stock)alr.push({k:'Low Stock',t:r.item,s:r.stock+' '+unitOf(r)+' left at '+(hasLoc(r)?r.location:'no location'),key:k,stock:r.stock})});
  S.deliveries.filter(d=>d.status=='Due'&&d.due<=td).forEach(d=>alr.push({k:'Delivery',t:d.supplier+': '+d.items,s:d.due<td?'Overdue since '+fd(d.due):'Due today',go:'deliveries'}));
  return{req,mov:mov.slice(0,20),alr,men:S.notes.filter(n=>n.to==USER)}}
function ncCount(){const d=ncData();return d.req.filter(r=>r.reqStatus=='Pending'||!ISADM()).length+d.mov.filter(x=>x.n).length+d.alr.length+d.men.filter(n=>!n.read).length}
function ncDraw(){const nc=$('#nc'),d=ncData(),T=UI.nc.t,show=k=>T=='All'||T==k,Ad=ISADM();ncAlerts=d.alr;
  const sec=(t,h)=>`<h3 class="nch">${t}</h3>${h||'<p class="empty">Nothing here.</p>'}`;
  const rq=d.req.map(r=>`<div class="nrow ${r.flag?'hot':''}"><span><span class="tag ${r.reqStatus=='Pending'?'y':'g'}">${esc(r.reqStatus)}</span> <b>${ordTag(r)} ${r.qty} ${esc(unitOf(r))} x ${esc(r.item)}</b><small>${esc(colTxt(r))}, ${esc(r.user)}, ${esc(r.time)}${r.note?', '+esc(r.note):''}</small></span><span class="acts">${r.reqStatus=='Pending'&&Ad?`<button class="mini pri" ${A('ncAct','approve',r.uid)}>Approve</button><button class="mini del" ${A('ncAct','reject',r.uid)}>Reject</button>`:''}${r.reqStatus=='Approved'?`<button class="mini" ${A('ncAct','receive',r.uid)}>Receive</button><button class="mini" ${A('ncAct','clr',r.uid)}>Clear</button>`:''}</span></div>`).join('');
  const al=d.alr.map((x,j)=>`<div class="nrow"><span><span class="tag ${x.k=='Alert'?'r':'y'}">${esc(x.k)}</span> <b>${esc(x.t)}</b><small>${esc(x.s)}</small></span><span class="acts">${x.go?`<button class="mini" ${A('ncAct','go',x.go)}>Open</button>`:`<button class="mini pri" ${A('ncAct','alr',j)}>Clear</button>`}</span></div>`).join('');
  const mv=d.mov.map(x=>`<div class="nrow ${x.n?'':'seen'}"><span><span class="tag ${x.r.type=='add'?'g':'r'}">${x.r.type=='add'?'In':'Out'}</span> <b>${x.r.qty} ${esc(unitOf(x.r))} x ${esc(x.r.item)}</b><small>${esc(x.r.user)}, ${esc(x.r.time)}, stock now ${x.r.stock}</small></span>${x.n?'<span class="dotn"></span>':''}</div>`).join('');
  const mn=d.men.slice().reverse().map(n=>`<div class="nrow ${n.read?'seen':''}"><span><span class="tag">Mention</span> <b>${esc(n.t)}</b><small>From ${esc(n.by)}, ${new Date(n.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></span><span class="acts">${n.read?'':`<button class="mini" ${A('ncAct','read',n.id)}>Read</button>`}<button class="mini del" ${A('ncAct','del',n.id)}>Delete</button></span></div>`).join('');
  nc.innerHTML=`<div class="nc-h"><h2>Notification Centre</h2><button class="mini" onclick="ncToggle(false)">Close</button></div><div class="chips" style="padding:.6rem 1.1rem 0">${NCTABS.map(t=>`<button class="chip ${T==t?'on':''}" ${A('ncTab',t)}>${t}</button>`).join('')}</div><div class="nc-t"><button class="mini" ${A('ncAct','readall')}>Mark all read</button><button class="mini" ${A('ncAct','clrall')}>Clear all</button><button class="mini pri" onclick="ncNote()">New message</button></div><div class="nc-b">${show('Requests')?sec('Stock Requests ('+d.req.length+')',rq):''}${show('Alerts')?sec('Alerts ('+d.alr.length+')',al):''}${show('Stock In/Out')?sec('Stock In And Out',mv):''}${show('Mentions')?sec('Mentions ('+d.men.length+')',mn):''}</div>`}
function ncTab(t){UI.nc.t=t;ncDraw()}
function ncToggle(o){$('#nc').classList.toggle('open',o);$('#ncbg').classList.toggle('open',o);if(o)ncDraw()}
function ncAct(a,x){
  if(a=='approve'){reqApprove(x);return}if(a=='reject'){reqReject(x);return}
  if(a=='receive'){ncToggle(false);reqReceive(x);return}if(a=='go'){ncToggle(false);go(x);return}
  if(a=='clr')moveClear(x);
  else if(a=='alr'){const q=ncAlerts[x];if(!q)return;if(q.uid){const r=byUid(q.uid);if(r){r.cleared=true;r.flag=false}}else if(q.key)S.dis[q.key]=q.stock}
  else if(a=='read'){const n=S.notes.find(n=>n.id==x);if(n)n.read=true}
  else if(a=='del')S.notes=S.notes.filter(n=>n.id!=x);
  else if(a=='readall'){ncData().mov.forEach(m=>S.seen[m.r.uid]=1);S.notes.forEach(n=>{if(n.to==USER)n.read=true})}
  else if(a=='clrall'){const d=ncData(),T=UI.nc.t,all=T=='All';
    if(all||T=='Requests')d.req.filter(r=>r.reqStatus!='Pending').forEach(r=>{r.cleared=true;r.reqStatus='Cleared'});
    if(all||T=='Alerts')d.alr.forEach(q=>{if(q.uid){const r=byUid(q.uid);if(r){r.cleared=true;r.flag=false}}else if(q.key)S.dis[q.key]=q.stock});
    if(all||T=='Mentions')S.notes=S.notes.filter(n=>n.to!=USER);
    if(all||T=='Stock In/Out')d.mov.forEach(m=>S.seen[m.r.uid]=1)}
  /* keep the seen-list from growing forever */
  const keep=new Set(S.items.map(r=>r.uid));Object.keys(S.seen).forEach(k=>{if(!keep.has(k))delete S.seen[k]});
  store();render()}
function ncNote(){const nm=[...new Set([USER,...S.staff.map(x=>x.name).filter(Boolean)])];
  form('New Message',[{k:'to',l:'Mention (To)',t:'select',o:nm,w:'full'},{k:'t',l:'Message',t:'area',w:'full',req:1,max:500}],{to:nm[1]},o=>{S.notes.push({id:shortId('N'),to:o.to,by:USER,t:o.t,at:Date.now(),read:false});if(S.notes.length>500)S.notes.splice(0,S.notes.length-500)})}

  seedHM();
  render();
