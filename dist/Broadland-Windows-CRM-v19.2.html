<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#012b59">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<title>Broadland Windows CRM</title>
<link rel="icon" id="fav" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Broadland Windows CRM v19.2 */
/* ==========================================================================
   01 · Design tokens (light + dark)
   ========================================================================== */
:root{
  --blue:#034ea2; --navy:#012b59; --yellow:#ffd002;
  --bg:#eef2f8; --card:#fff; --card2:#f6f8fc;
  --ink:#0c1a2e; --muted:#56657d; --line:#d9e1ee;
  --green:#12794c; --green-bg:#e0f3ea;
  --red:#bf3434;   --red-bg:#fbe7e7;
  --amber:#6b5500; --amber-bg:#fff2b8;
  --blue-bg:#e2edfa;
  --btn:#034ea2; --btn-h:#012b59;
  --hover:#eef3fa;
  --head:"Bricolage Grotesque",Georgia,sans-serif;
  --body:Figtree,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --r:16px; --r-sm:10px;
  --sh:0 1px 2px rgba(1,43,89,.06),0 6px 18px rgba(1,43,89,.06);
  --sh-lg:0 20px 50px rgba(1,43,89,.25);
  --sw:clamp(14.5rem,15vw,17.5rem);     /* sidebar width */
  --gap:clamp(.6rem,1.2vw,1.1rem);       /* page gutters */
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
body[data-theme=dark]{
  --blue:#5a9bf5; --navy:#d3e3fb;
  --bg:#0d1117; --card:#181d26; --card2:#1f2530;
  --ink:#e9ebef; --muted:#9aa4b4; --line:#2b313c;
  --green:#7fe0aa; --green-bg:#0f3a29;
  --red:#ffa3a3;   --red-bg:#4a2020;
  --amber:#ffd96b; --amber-bg:#4a3f0a;
  --blue-bg:#1f3556;
  --btn:#2a62c9; --btn-h:#1f4fa8;
  --hover:#222935;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}

/* ==========================================================================
   02 · Base, typography, motion
   ========================================================================== */
*{box-sizing:border-box}
html{font-size:clamp(13px,.22vw + 10.4px,16.5px);-webkit-text-size-adjust:100%}
@media(min-width:2200px){html{font-size:clamp(16.5px,.45vw + 6px,22px)}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.45 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
img{max-width:100%}
a{color:var(--blue)}

/* House style: Title Case labels. URLs, emails, codes and typed text are left alone. */
body,body *{text-transform:capitalize}
input,textarea,code,kbd,.nocap,.nocap *,a[href^="mailto"],a[href^="http"],a[href^="tel"]{text-transform:none!important}

h1{font:600 1.35rem var(--head);margin:0;letter-spacing:-.015em;color:var(--navy)}
h2{font:600 1rem var(--head);margin:0 0 .7rem;color:var(--navy)}
h3{font:600 .92rem var(--head);margin:1rem 0 .35rem;color:var(--navy)}
b,strong{font-weight:600}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:.85rem;margin:.5rem 0}
.warn{color:var(--red);font-size:.88rem}
code{font:500 .76rem ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card2);border-radius:5px;padding:.1rem .35rem}
.num{font-variant-numeric:tabular-nums}

/* scrollbars: thin, unobtrusive */
*{scrollbar-width:thin;scrollbar-color:rgba(90,110,140,.35) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(90,110,140,.35);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* motion */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{width:0}}
@keyframes grow2{from{transform:scaleY(0)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}}
@keyframes spLogo{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,191,117,.6)}100%{box-shadow:0 0 0 .8rem rgba(31,191,117,0)}}
@keyframes navIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes sc{from{top:10%}to{top:90%}}
@keyframes hintOut{0%,70%{opacity:.9}100%{opacity:0}}
.main.enter .kpi,.main.enter .panel,.main.enter .col,.main.enter .cc,.main.enter .bc,.main.enter .hero,.main.enter .dlane{animation:up .45s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*35ms)}
body.ready .side .nav{animation:navIn .45s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--n,0)*30ms + 200ms)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}#splash{display:none}}
/* focusable page area must not draw the yellow ring (it showed round the page after closing a popup) */
#main:focus,#main:focus-visible,[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}

/* ==========================================================================
   03 · App shell: sidebar, top bar, main area, splash, notification centre
   ========================================================================== */
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);height:100dvh}
.wrap{display:flex;flex-direction:column;min-width:0;height:100dvh}
.main{flex:1;overflow:auto;padding:var(--gap) calc(var(--gap)*1.6) calc(var(--gap)*1.6 + var(--safe-b));scrollbar-gutter:stable}

/* ---- sidebar ---- */
.side{margin:.75rem 0 .75rem .75rem;padding:1rem .8rem .8rem;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0;overflow:hidden}
/* The logo spans exactly the same width as the nav buttons below it */
.brand{display:block;padding:.4rem 0 1rem;margin:0}
.brand .lg{display:block;width:100%;height:auto}
#nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:0;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.nl{font-size:.66rem;font-weight:500;color:var(--muted);padding:.85rem .7rem .3rem}
.nav{position:relative;display:flex;align-items:center;gap:.7rem;width:100%;height:2.2rem;padding:0 .7rem;border:0;border-radius:10px;background:none;color:var(--ink);font-size:.86rem;font-weight:500;text-align:left;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
.nav svg{width:1.08rem;height:1.08rem;flex-shrink:0;opacity:.72}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--hover);font-weight:600}
.nav.on svg{opacity:1;color:var(--blue)}
body[data-theme=dark] .nav.on svg{color:var(--yellow)}
/* slim selection marker */
.nav.on::before{content:"";position:absolute;left:0;top:30%;bottom:30%;width:2px;border-radius:2px;background:var(--yellow)}
.nav i{margin-left:auto;min-width:1.25rem;height:1.15rem;padding:0 .4rem;display:inline-flex;align-items:center;justify-content:center;font:600 .68rem var(--body);font-style:normal;border-radius:20px;background:var(--blue);color:#fff}
body[data-theme=dark] .nav i{background:var(--yellow);color:#0c1a2e}
.nav .lk{margin-left:auto;width:.85rem;height:.85rem;opacity:.45}

.who{display:flex;align-items:center;gap:.6rem;margin-top:.5rem;padding:.65rem .35rem .2rem;border-top:1px solid var(--line)}
.who .me{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;border:0;background:none;padding:.3rem;border-radius:10px;text-align:left;cursor:pointer}
.who .me:hover{background:var(--hover)}
.who .me>div{min-width:0}
.who b{display:block;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .av2{color:#fff;display:grid;font-size:.78rem;width:2.1rem;height:2.1rem}
.av2{width:2.1rem;height:2.1rem;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font:600 .78rem var(--head);flex-shrink:0}
.acct{display:flex;align-items:center;justify-content:center;gap:.45rem;width:100%;height:2.3rem;margin-top:.5rem;border:0;border-radius:11px;background:var(--hover);color:var(--ink);font-size:.78rem;font-weight:600;cursor:pointer}
.acct:hover{background:var(--blue-bg)}
.acct svg{width:1rem;height:1rem}
body.isadm .acct{background:var(--yellow);color:#012b59}

/* ---- top bar ---- */
.top{position:relative;z-index:60;display:flex;align-items:center;gap:.55rem;margin:.75rem calc(var(--gap)*1.6) 0;padding:.45rem .55rem .45rem .7rem;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.sb{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:.55rem;height:2.45rem;padding:0 .9rem;border-radius:999px;background:var(--card2);border:1px solid var(--line);transition:box-shadow .2s}
.sb:focus-within{box-shadow:0 0 0 3px rgba(3,78,162,.25)}
.sb svg{width:17px;height:17px;opacity:.55;flex-shrink:0}
.sb input{flex:1;min-width:0;height:100%;padding:0;border:0;background:transparent;outline:none;font-size:.9rem}
.sb input::-webkit-search-cancel-button{display:none}
.sb kbd{margin-left:auto;font:600 .68rem var(--head);padding:.12rem .42rem;border:1px solid var(--line);border-radius:6px;color:var(--muted);background:var(--card)}
.sb .clr{display:none;width:1.4rem;height:1.4rem;border:0;border-radius:50%;background:var(--line);cursor:pointer;line-height:1}
.sb.has kbd{display:none}.sb.has .clr{display:block}
.ib{flex-shrink:0;width:2.4rem;height:2.4rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--muted);cursor:pointer;position:relative}
.ib:hover{color:var(--blue);border-color:var(--blue)}
.ib svg{width:1.1rem;height:1.1rem}
.bn{position:absolute;top:-.4rem;right:-.4rem;min-width:1.15rem;height:1.15rem;padding:0 .25rem;border-radius:1rem;background:var(--yellow);color:#012b59;font-size:.66rem;font-weight:600;display:flex;align-items:center;justify-content:center}
#mnb{display:none}
.nw{position:relative}
.menu{position:absolute;right:0;top:calc(100% + .4rem);z-index:80;display:none;min-width:13rem;padding:.35rem;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu.open{display:block}
.menu button{display:flex;gap:.6rem;width:100%;padding:.55rem .7rem;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}
.menu button:hover{background:var(--blue-bg)}
.adminbar{display:none;margin:.5rem calc(var(--gap)*1.6) 0;padding:.35rem .9rem;border-radius:10px;background:linear-gradient(90deg,#ffd002,#ffe26b);color:#012b59;font-size:.78rem;font-weight:600}
body.isadm .adminbar{display:block}
body[data-theme=dark] .adminbar{background:rgba(255,208,2,.16);color:#ffe27a}
.secbar{display:none;margin:.5rem calc(var(--gap)*1.6) 0;padding:.35rem .9rem;border-radius:10px;background:var(--red-bg);color:var(--red);font-size:.78rem;font-weight:600}
.secbar.on{display:block}

/* ---- splash, scrim, toast ---- */
#splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle at 50% 42%,#034ea2,#012b59 72%);animation:spOut .5s 1.3s ease-in forwards}
#splash img{width:min(340px,72vw);animation:spLogo .9s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 8px 30px rgba(0,0,0,.35))}
.scrim{display:none;position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.45)}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + var(--safe-b));transform:translateX(-50%);z-index:300;display:none;max-width:calc(100vw - 2rem);padding:.65rem 1.1rem;border-radius:10px;border-left:4px solid var(--yellow);background:#012b59;color:#fff;animation:tin .3s}

/* ---- notification centre ---- */
#ncbg{position:fixed;inset:0;z-index:89;background:rgba(1,43,89,.35);opacity:0;pointer-events:none;transition:opacity .25s}
#ncbg.open{opacity:1;pointer-events:auto}
.nc{position:fixed;top:0;right:0;bottom:0;z-index:90;width:min(27rem,100vw);display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(1,43,89,.2);transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.nc.open{transform:none}
.nc-h{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.1rem .2rem}.nc-h h2{margin:0}
.nc-t{display:flex;flex-wrap:wrap;gap:.4rem;padding:.2rem 1.1rem .6rem;border-bottom:1px solid var(--line)}
.nc-b{flex:1;overflow:auto;padding:.3rem 1.1rem calc(1rem + var(--safe-b))}
.nch{margin:.9rem 0 .2rem;font-size:.82rem;color:var(--muted)}
.dotn{width:.5rem;height:.5rem;border-radius:50%;background:var(--blue);flex-shrink:0}

/* ---- full-screen TV mode (factory floor) ---- */
body.tv .side,body.tv .top,body.tv .adminbar,body.tv .secbar{display:none!important}
body.tv .app{display:block}
body.tv .wrap{width:100vw;height:100vh}
body.tv .main{padding:clamp(1.2rem,2vw,2.4rem) clamp(1.4rem,2.6vw,3.2rem)}
body.tv .lvg{gap:1.1rem}
body.tv .fl-head .acts{display:none}
body.tv .main::after{content:"Press Esc Or Double-Click To Exit Full Screen";position:fixed;bottom:.8rem;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--muted);animation:hintOut 6s forwards;pointer-events:none}

/* ==========================================================================
   04 · Components: buttons, cards, tables, tags, modals, forms
   ========================================================================== */
/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.48rem .9rem;border:0;border-radius:10px;background:var(--btn);color:#fff;font-size:.84rem;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,background .15s}
.btn:hover{background:var(--btn-h)}
.btn:active{transform:scale(.97)}
.btn svg{width:1rem;height:1rem}
.btn.ghost{background:var(--card);color:var(--blue);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue);background:var(--blue-bg)}
.btn.scan{position:relative;overflow:hidden;background:var(--yellow);color:#012b59}
.btn.scan:hover{background:#ffdf4d}
.btn.green{background:#12794c}.btn.red{background:#bf3434}
.btn.sm{padding:.36rem .7rem;font-size:.78rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.mini{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;height:1.75rem;padding:0 .6rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:.74rem;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .12s}
.mini:hover{border-color:var(--blue);color:var(--blue)}
.mini:active{transform:scale(.96)}
.mini.pri{background:var(--btn);border-color:var(--btn);color:#fff}
.mini.del{color:var(--red)}
.mini.ok{color:var(--green)}
.mini svg{width:.9rem;height:.9rem}
.mini[disabled],.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.acts{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.acts.r{justify-content:flex-end;flex-wrap:nowrap}
.tools{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.vs{width:1px;height:1.3rem;background:var(--line)}

/* segmented controls */
.seg,.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button,.seg2 button{border:0;background:none;padding:.34rem .8rem;font-size:.78rem;cursor:pointer;color:var(--ink)}
.seg button+button,.seg2 button+button{border-left:1px solid var(--line)}
.seg button:hover,.seg2 button:hover{background:var(--blue-bg)}
.seg button.on,.seg2 button.on{background:var(--blue-bg);font-weight:600;color:var(--blue)}
.seg2 .g{color:var(--green)}.seg2 .r{color:var(--red)}

/* ---- page header ---- */
.head{display:flex;align-items:center;justify-content:space-between;gap:.8rem 1rem;flex-wrap:wrap;margin-bottom:1rem}
.head .tools{margin-left:auto}

/* ---- cards ---- */
.panel,.tw,.cc,.bc,.kpi,.dcard,.dlane{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.panel{padding:1rem 1.1rem;min-width:0}
.panel>h2{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));gap:var(--gap)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));gap:.7rem;margin-bottom:1.1rem}
.kpi{padding:.85rem 1rem;text-align:left;border-left:4px solid var(--blue)!important;transition:transform .2s}
button.kpi,.kpi.lnk{cursor:pointer}
button.kpi:hover,.kpi.lnk:hover{transform:translateY(-2px)}
.kpi.on{background:var(--blue-bg)}
.kpi.warn{border-left-color:var(--yellow)!important}.kpi.bad{border-left-color:var(--red)!important}
.kpi small{display:block;color:var(--muted);font-size:.8rem}
.kpi b{display:block;font:600 clamp(1.5rem,1.9vw,2.4rem)/1.15 var(--head);color:var(--navy);margin-top:.15rem}
.kpis.big{grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:1rem}
.kpis.big .kpi{padding:1rem 1.2rem;border-left-width:6px!important}
.kpis.big .kpi small{font-size:clamp(.85rem,.9vw,1.2rem);font-weight:500}
.kpis.big .kpi b{font-size:clamp(2.2rem,3.2vw,4.4rem);line-height:1.1}
.ksub{display:block;font-size:.7rem;color:var(--muted);margin-top:.1rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>b{text-align:right}
.nrow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem .3rem;border-bottom:1px solid var(--line)}
.nrow:last-child{border:0}
.nrow>span:first-child{min-width:0;overflow:hidden}
.nrow>span:first-child b,.nrow small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow small{color:var(--muted)}
.nrow.hot{box-shadow:inset 3px 0 var(--red);padding-left:.6rem}
.nrow.seen{opacity:.6}
.nrow.jr{display:block}
.nrow .acts{flex-wrap:nowrap;flex-shrink:0}

/* chips + filters */
.chips,.sg2{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.24rem .7rem;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--muted);font-size:.78rem;cursor:pointer}
.chip.on{background:#012b59;border-color:#012b59;color:#fff}
body[data-theme=dark] .chip.on{background:#d3e3fb;border-color:#d3e3fb;color:#0c1a2e}
.fsel{padding:.3rem .6rem;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.78rem}

/* ---- tables ---- */
.tw{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{position:sticky;top:0;z-index:1;background:var(--card2);text-align:left;padding:.6rem .75rem;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:.55rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
th.srt{cursor:pointer;user-select:none}
th.srt:hover{color:var(--blue)}
th .ar{color:var(--blue);margin-left:.25rem}
th.ac,td.ac{text-align:right;position:sticky;right:0;background:var(--card)}
th.ac{background:var(--card2);z-index:2}
tbody tr:hover td.ac{background:var(--hover)}
tr.sel td{background:var(--blue-bg)!important}
.ptb td,.ptb th,.dtb td,.dtb th{white-space:nowrap}
.ptb input[type=checkbox]{width:1rem;height:1rem;accent-color:#034ea2}
.tn{width:34px;height:34px;object-fit:cover;border-radius:6px;vertical-align:middle}
.pager{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.7rem .2rem 0;font-size:.8rem;color:var(--muted)}
.pager .acts{gap:.25rem}
.pager .mini.on{background:var(--btn);border-color:var(--btn);color:#fff}
.fbtn{display:inline-grid;place-items:center;width:1.75rem;height:1.75rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);cursor:pointer;vertical-align:middle}
.fbtn:hover,.fbtn.on{color:var(--blue);border-color:var(--blue)}
.fbtn.on{background:var(--blue-bg)}
.fbtn svg{width:.95rem;height:.95rem}
.fpop{position:fixed;z-index:120;width:min(19rem,calc(100vw - 1.5rem));padding:.9rem;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 14px 40px rgba(1,43,89,.25);display:none;animation:pop .2s}
.fpop.open{display:block}
.fpop h3{margin:.2rem 0 .4rem;font-size:.8rem;color:var(--muted)}
.fpop h3:first-child{margin-top:0}
.fpop select{width:100%;padding:.45rem .6rem;border:1px solid var(--line);border-radius:9px;background:var(--card2);margin-bottom:.4rem}
.fpop .acts{margin-top:.6rem;justify-content:space-between}
.selbar{position:sticky;top:0;z-index:5;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;padding:.5rem .7rem;margin-bottom:.7rem;border-radius:12px;background:#012b59;color:#fff}
body[data-theme=dark] .selbar{background:#0f2a4d}
.selbar .mini{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.selbar .mini.del{color:#ffb4b4}.selbar .mini.pri{background:#ffd002;color:#0c1a2e;border-color:#ffd002}

/* ---- tags ---- */
.tag{display:inline-flex;align-items:center;justify-content:center;padding:.12rem .5rem;border-radius:20px;font-size:.7rem;font-weight:500;line-height:1.2;white-space:nowrap;background:var(--blue-bg);color:var(--blue)}
.tag.g{background:var(--green-bg);color:var(--green)}
.tag.r{background:var(--red-bg);color:var(--red)}
.tag.y{background:var(--amber-bg);color:var(--amber)}
.tag.n{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.tag.fw{width:5rem}
.ord{font:600 .75rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}
.ord.p{color:var(--amber)}
.ms{display:inline-flex;gap:2px;margin-left:.4rem;vertical-align:middle}.ms i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line)}.ms i.on{background:var(--green)}
.live{display:inline-block;width:.7rem;height:.7rem;margin-right:.45rem;border-radius:50%;background:#1fbf75;animation:pulse 1.6s infinite}

/* ---- progress bars ---- */
.bar{height:7px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--btn);animation:grow .9s .15s backwards}
.bar2{height:11px;border-radius:8px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#034ea2,#3b82d8);animation:grow .9s .15s backwards}
.hb{display:grid;grid-template-columns:minmax(6rem,9rem) 1fr minmax(4rem,6rem);gap:.7rem;align-items:center;padding:.3rem 0;font-size:.84rem}
.hb b{text-align:right}
.cols{display:flex;gap:.35rem;align-items:flex-end;height:8rem}
.cols>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cols i{width:70%;border-radius:5px 5px 0 0;background:var(--btn);transform-origin:bottom;animation:grow2 .8s cubic-bezier(.2,.7,.2,1) backwards}
.cols i.hot{background:var(--yellow)}
.cols small{font-size:.65rem;color:var(--muted)}.cv2{font-size:.68rem;font-weight:600}
.stp{display:flex;gap:.2rem;margin:.6rem 0 1rem}
.stp span{flex:1;text-align:center;font-size:.64rem;color:var(--muted)}
.stp i{display:grid;place-items:center;width:26px;height:26px;margin:0 auto .2rem;border-radius:50%;background:var(--line);font-style:normal;font-weight:600}
.stp .on{color:var(--navy);font-weight:600}.stp .on i{background:var(--btn);color:#fff}

/* ---- modal ---- */
.ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:1rem;background:rgba(1,43,89,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.ov.open{display:flex;animation:fade .2s}
#scanner{z-index:200}
.mb{position:relative;width:min(64rem,96vw);max-height:92dvh;overflow:auto;padding:1.3rem 1.4rem 0;border-radius:20px;background:var(--card);color:var(--ink);box-shadow:var(--sh-lg);animation:pop .28s cubic-bezier(.2,.8,.3,1)}
.mb.lg{width:min(76rem,96vw)}
.mb.sm{width:min(30rem,96vw)}
.mb.md{width:min(46rem,96vw)}
.mb.xl{width:min(82rem,96vw);height:min(92dvh,62rem);display:flex;flex-direction:column;padding:0}
.mb>h2:first-child{padding-right:2rem}
.mx{position:absolute;top:.8rem;right:.8rem;width:2rem;height:2rem;border:0;border-radius:50%;background:var(--card2);cursor:pointer;font-size:1.2rem;line-height:1;z-index:3}
.mact{position:sticky;bottom:0;z-index:2;display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin:1rem -1.4rem 0;padding:.8rem 1.4rem calc(.9rem + var(--safe-b));background:var(--card);border-top:1px solid var(--line)}
.mact.col{flex-direction:column}
.mact .l{margin-right:auto}

/* ---- forms ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:.75rem 1rem}
.ff{min-width:0}
.ff.full{grid-column:1/-1}
.ff label,.dfm label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.25rem;font-weight:500}
.ff input,.ff select,.ff textarea,.dfm input,.dfm select,.dfm textarea{width:100%;padding:.5rem .65rem;border:1px solid var(--line);border-radius:9px;background:var(--card2)}
.ff input[readonly]{opacity:.8;font-family:ui-monospace,monospace}
.ff .hint{display:block;font-size:.72rem;color:var(--muted);margin-top:.2rem}
.ff .inl{display:flex;gap:.4rem}
.ff label.cbl{display:flex;align-items:center;gap:.4rem;margin-top:.35rem;font-size:.78rem;cursor:pointer}
.cbl input{width:auto!important}
.dfm label{margin:.55rem 0 .15rem}
input[type=color]{width:48px!important;padding:2px!important;cursor:pointer}
.sws{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.4rem}
.sw{width:26px;height:26px;padding:0;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .15s}.sw:hover{transform:scale(1.15)}
.thumbs{display:flex;flex-wrap:wrap;gap:.5rem;margin:.3rem 0}
.th{position:relative}
.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border:0;border-radius:50%;background:var(--red);color:#fff;cursor:pointer;line-height:1}
.prow{display:flex;gap:.5rem;flex-wrap:wrap}
.mf{display:flex;gap:.5rem;margin:.6rem 0 .9rem}
.mf input{flex:1;min-width:0;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--card2)}

/* account picker */
.rl{display:grid;gap:.5rem}
.rb{display:flex;flex-direction:column;align-items:flex-start;padding:.7rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer;transition:transform .18s,border-color .18s}
.rb:hover{border-color:var(--blue);transform:translateX(4px)}
.rb.on{border-color:var(--yellow);box-shadow:inset 4px 0 var(--yellow)}
.rb span{color:var(--muted);font-size:.8rem}
.rb[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* ---- scanner ---- */
.vwrap{position:relative;aspect-ratio:4/3;margin-bottom:.6rem;border-radius:12px;overflow:hidden;background:#000}
.vwrap video{width:100%;height:100%;object-fit:cover}
.ret{position:absolute;inset:25% 12%;border:3px solid var(--yellow);border-radius:12px;box-shadow:0 0 0 999px rgba(1,43,89,.35)}
.ret::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--yellow);animation:sc 1.6s ease-in-out infinite alternate}

/* ==========================================================================
   05 · Page-specific styles
   ========================================================================== */
/* ---- overview ---- */
.hero{position:relative;overflow:hidden;margin-bottom:1.1rem;padding:1.2rem 1.4rem;border-radius:var(--r);border-bottom:4px solid var(--yellow);background:linear-gradient(120deg,#012b59,#034ea2);color:#fff}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,208,2,.12)}
.hero h1{color:#fff;font-size:1.6rem}
.hero p{margin:.3rem 0 0;color:#cfe0f7}
.hero .rt{display:inline-block;margin-bottom:.4rem;padding:.12rem .6rem;border-radius:20px;background:rgba(255,255,255,.18);font-size:.74rem}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2s .6s 2}
.hl{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.6rem 0;text-align:center}
.hl b{display:block;font:600 1.45rem var(--head);color:var(--navy)}
.hl small{color:var(--muted);font-size:.74rem}
.hl .big b{font-size:1.9rem;color:var(--blue)}

/* ---- leads kanban ---- */
.kan{display:grid;grid-template-columns:repeat(5,minmax(15rem,1fr));gap:.8rem;overflow-x:auto;padding-bottom:.5rem}
.col{min-height:200px;padding:.7rem;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.colh{display:flex;justify-content:space-between;margin-bottom:.6rem;color:var(--navy)}
.colh span{color:var(--muted);font-size:.78rem}
.lc{margin-bottom:.55rem;padding:.7rem;border-radius:10px;background:var(--card);border:1px solid var(--line);transition:transform .2s}
.lc:hover{transform:translateY(-2px)}
.lc p{margin:.15rem 0;font-size:.82rem}
.lt{display:flex;justify-content:space-between;gap:.5rem}
.lt b{cursor:pointer}.lt b::after{content:" \203A";color:var(--blue)}
.lt span{font-weight:600;color:var(--blue)}
.lb{display:flex;gap:.3rem;margin-top:.5rem;flex-wrap:wrap}

/* ---- calendar ---- */
.cm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.cm .dh{padding:.5rem;text-align:center;font-size:.75rem;color:var(--muted);background:var(--card2);border-bottom:1px solid var(--line)}
.dc2{min-height:6.8rem;min-width:0;display:flex;flex-direction:column;gap:2px;padding:.3rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.dc2:nth-child(7n){border-right:0}
.dc2:hover{background:var(--blue-bg)}
.dc2.out{opacity:.7}.dc2.we{background:rgba(120,130,150,.07)}.dc2.bh{background:var(--amber-bg)}
.dc2.sel{outline:2px solid var(--blue);outline-offset:-2px}
.dn{width:1.6rem;height:1.6rem;display:grid;place-items:center;flex-shrink:0;font-size:.8rem;font-weight:600}
.dc2.today .dn{border-radius:50%;background:var(--btn);color:#fff}
.evs{display:flex;flex-direction:column;gap:2px;min-width:0}
.wk .dc2{min-height:16rem}
.ce{display:block;padding:1px 6px;border-left:3px solid;border-radius:5px;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ce.fit{background:var(--blue-bg);border-color:#034ea2;color:var(--navy)}
.ce.svc{background:#fff0dd;border-color:#e08a00;color:#7a4700}
.ce.del{background:#efe6fb;border-color:#7a4fd0;color:#3b2278}
.ce.hol{background:var(--green-bg);border-color:#12794c;color:var(--green)}
.ce.hol.pd{background:var(--amber-bg);border-color:#b28900;color:var(--amber)}
body[data-theme=dark] .ce.svc{background:#3a2a10;color:#ffcf8a}
body[data-theme=dark] .ce.del{background:#2a2140;color:#d9c9ff}
.more{font-size:.68rem;color:var(--muted)}
.ag{display:grid;grid-template-columns:7rem 1fr;gap:.4rem 1rem;align-items:start}
.ag .ce{margin-bottom:3px;padding:.3rem .6rem;font-size:.82rem}
.ldot{display:inline-block;width:.6rem;height:.6rem;margin-right:.35rem;border-radius:50%}

/* ---- holiday planner ---- */
.tl{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tlg{display:grid;width:max-content;min-width:100%}
.tlg>div{display:flex;align-items:center;justify-content:center;height:2.4rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.75rem;cursor:pointer}
.tlg .nm{position:sticky;left:0;z-index:2;justify-content:flex-start;padding:0 .7rem;background:var(--card);font-weight:600;white-space:nowrap;cursor:default}
.tlg .hd{flex-direction:column;height:3rem;line-height:1.15;background:var(--card2);color:var(--muted);cursor:default}
.tlg .we{background:rgba(120,130,150,.09)}.tlg .bh{background:var(--amber-bg)}.tlg .td{box-shadow:inset 0 0 0 2px var(--blue)}
.tlg .hv{background:#12794c;color:#fff}
.tlg .hv.pd{background:repeating-linear-gradient(45deg,#d9ad00,#d9ad00 4px,#f0c93a 4px,#f0c93a 8px);color:#4a3b00}
.tlg .cov{font-weight:700;cursor:default}.tlg .cov.w{background:var(--amber-bg)}.tlg .cov.x{background:var(--red-bg);color:var(--red)}
.heat{text-align:center;font-weight:600}

/* ---- contact book / files cards ---- */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:1rem}
.book.lst{grid-template-columns:1fr}
.book.lst .bc{flex-direction:row;align-items:center}
.book.lst .bc>.cv{width:6rem;flex-shrink:0}
.az{grid-column:1/-1;padding-bottom:.15rem;margin-top:.4rem;border-bottom:2px solid var(--yellow);font:700 1.25rem var(--head);color:var(--blue)}
.cc{display:flex;gap:.8rem;padding:.9rem}
.av{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border-radius:12px;background:#012b59;color:var(--yellow);font:700 1rem var(--head)}
.ci{flex:1;min-width:0;font-size:.85rem}
.ci a{display:block;text-decoration:none}
.bc{display:flex;flex-direction:column;overflow:hidden;transition:transform .18s}
.bc:hover{transform:translateY(-3px)}
.bc .cv{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#dfe7f3}
.bc .bb{flex:1;display:flex;flex-direction:column;gap:.5rem;padding:.85rem 1rem 1rem}
.bc .bb b{font:600 .98rem var(--head);line-height:1.25}
.bc .acts{margin-top:auto}
.dlt{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.2rem 0 1rem}

/* Files: every row uses the same column grid so the category tags line up */
.frow{display:grid;grid-template-columns:minmax(0,1fr) 7.5rem 4.5rem 17.5rem;align-items:center;gap:.4rem .6rem;padding:.55rem .2rem;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow>b{min-width:0;word-break:break-word;font-weight:500}
.frow>.tag{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.frow>.sz{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.frow>.acts{justify-content:flex-end;flex-wrap:nowrap}
.fhead{color:var(--muted);font-size:.72rem;border-bottom:1px solid var(--line)}
.fhead>span:nth-child(3){text-align:right}
.cvw{position:relative;overflow:hidden;aspect-ratio:4/3;background:#dfe7f3}.cvw>svg,.cvw>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cvw>img{background:#fff;object-fit:contain}
.book.lst .bc>.cvw{width:6rem;flex-shrink:0}
.covb{position:absolute;right:.5rem;top:.5rem;z-index:2;opacity:0;transition:opacity .2s}.bc:hover .covb,.covb:focus{opacity:1}
.upl{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
.upl select,.upl input{padding:.45rem .6rem;border-radius:9px;border:1px solid var(--line);background:var(--card2)}
.flist{max-height:28rem;overflow:auto}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.7rem}
.dc{display:flex;flex-direction:column;gap:.25rem;padding:.8rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--card2);text-align:left;cursor:pointer}
.dc:hover{border-color:var(--blue)}.dc span{font-size:.82rem}

/* ---- factory floor ---- */
.fl-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.fl .kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:1rem}
.fl .kpi{padding:1rem 1.2rem;border-left-width:6px!important}
.fl .kpi small{font-size:clamp(.85rem,.9vw,1.25rem);font-weight:500}
.fl .kpi b{display:block;font-size:clamp(2.4rem,3.6vw,5rem);line-height:1.1}
.fl .ksub{font-size:clamp(.75rem,.75vw,1.05rem)}
.fl .panel h2{font-size:clamp(1rem,1.1vw,1.5rem)}
.fl .nrow b{font-size:clamp(.85rem,.85vw,1.15rem)}
.prio{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.5rem .3rem;border-bottom:1px solid var(--line)}
.prio:last-child{border:0}.prio .pn{display:grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;font:700 .85rem var(--head);background:var(--card2)}
.prio.p1 .pn{background:var(--red);color:#fff}.prio.p2 .pn{background:var(--yellow);color:#012b59}
.prio>span{min-width:0}.prio b,.prio small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prio small{color:var(--muted)}
.clk{font:700 clamp(1.8rem,3.2vw,4.2rem) var(--head);color:var(--navy);font-variant-numeric:tabular-nums}
body.lv .main{overflow:hidden;display:flex;flex-direction:column}
body.lv .fl{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7rem}
body.lv .fl .kpis{margin:0}
.lvg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
body.lv .lvg{flex:1;min-height:0;grid-template-rows:repeat(2,minmax(0,1fr))}
.lvg>.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;margin:0}
.lvg .cols{flex:1;height:auto;min-height:5rem}

/* ---- deliveries ---- */
.dlanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:.9rem;align-items:start}
.dlane{padding:.8rem}
.dlane h2{display:flex;justify-content:space-between;align-items:center;margin:0 0 .6rem}
.dcard{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.6rem;padding:.75rem .85rem;box-shadow:none}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.dsup{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--muted)}
.dsup i{width:.6rem;height:.6rem;border-radius:50%}
.dact{display:flex;gap:.35rem;margin-top:.25rem}.dst{font-size:.78rem;color:var(--muted)}

/* ---- inventory: near full-screen item editor ---- */
.ie-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 4rem 1rem 1.4rem;border-bottom:1px solid var(--line)}
.ie-h h2{margin:0;font-size:1.15rem}
.ie-h .muted{font-size:.8rem}
.ie{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.4fr)}
.ie-ph{display:flex;flex-direction:column;gap:.8rem;min-height:0;overflow:auto;padding:1.2rem 1.4rem;background:var(--card2);border-right:1px solid var(--line)}
.ie-main{position:relative;flex:1;min-height:14rem;display:grid;place-items:center;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.ie-main img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}
.ie-main .empty{text-align:center;padding:1rem}
.ie-main svg{width:3rem;height:3rem;opacity:.3;display:block;margin:0 auto .5rem}
.ie-strip{display:flex;gap:.5rem;flex-wrap:wrap}
.ie-strip .th img{width:4.6rem;height:4.6rem;object-fit:cover;border-radius:9px;border:2px solid transparent;cursor:pointer}
.ie-strip .th.on img{border-color:var(--blue)}
.ie-f{min-height:0;overflow:auto;padding:1.1rem 1.4rem 1.4rem}
.ie-f fieldset{border:0;padding:0;margin:0 0 1.1rem}
.ie-f legend{font:600 .82rem var(--head);color:var(--navy);padding:0 0 .5rem;width:100%;border-bottom:1px solid var(--line);margin-bottom:.7rem}
.ie-f .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr))}
/* Product row: Stock ID | Item | Unit, then Qty | Barcode | Length (length directly under unit) */
.ie-f .grid.ie-prod{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.sws .mini.on{border-color:var(--blue);color:var(--blue)}
.mb.xl .mact{margin:0;border-top:1px solid var(--line)}
.ie-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.ie-stats div{padding:.55rem .7rem;border-radius:10px;background:var(--card);border:1px solid var(--line)}

.side,.top,.panel,.kpi,.tw,.cc,.bc,.dlane,.supw,.col,.nc,.menu,.fpop{-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}

/* popups: near-solid so the page behind never makes them hard to read */

/* no hover movement anywhere: shadow only */

/* ---------- liquid glass (web take on Apple's rules: glass on the control layer, content stays readable) ---------- */
:root{--lg-fill:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.38));--lg-edge:rgba(255,255,255,.85);
  --lg-spec:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.4),inset -1px 0 0 rgba(255,255,255,.25);
  --lg-drop:0 10px 30px -12px rgba(1,43,89,.28),0 2px 6px -2px rgba(1,43,89,.12)}
body[data-theme=dark]{--lg-fill:linear-gradient(180deg,rgba(40,48,64,.62),rgba(20,26,38,.48));--lg-edge:rgba(255,255,255,.14);
  --lg-spec:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04);--lg-drop:0 12px 32px -12px rgba(0,0,0,.6)}
.side,.top{background:var(--lg-fill)!important;border:1px solid var(--lg-edge)!important;box-shadow:var(--lg-spec),var(--lg-drop)!important;
  -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.04);backdrop-filter:blur(26px) saturate(190%) brightness(1.04)}
/* controls: clear glass pills, concentric with their bar */
.top .ib,.top #thb,.top #bell,.seg2,.views .chip,.pager select{background:rgba(255,255,255,.42);border-color:var(--lg-edge);box-shadow:var(--lg-spec);
  -webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%)}
body[data-theme=dark] .top .ib,body[data-theme=dark] .top #thb,body[data-theme=dark] .top #bell,body[data-theme=dark] .seg2,body[data-theme=dark] .views .chip{background:rgba(255,255,255,.06)}
.views .chip.on{background:var(--navy,#012b59);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.sb{background:rgba(255,255,255,.45)!important;box-shadow:inset 0 1px 2px rgba(1,43,89,.08),inset 0 -1px 0 rgba(255,255,255,.6)}
body[data-theme=dark] .sb{background:rgba(255,255,255,.05)!important}
.rw-bar{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.15)}
.rb1{box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
/* Reduce Transparency / Increase Contrast: solid surfaces, no blur */

  .side,.top,.panel,.kpi,.tw,.cc,.bc,.dlane,.supw,.col,.nc,.menu,.fpop,.mb,.rg,.top .ib,.seg2,.views .chip{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .side,.top{background:var(--card)!important}
  .mb{background:var(--card)!important}
  body[data-theme=dark] .side,body[data-theme=dark] .top{background:#141a25!important}}
body[data-theme=dark] .views .chip.on{background:#2a62c9;color:#fff}

.cc2-b{display:flex;flex-direction:column;gap:.35rem;font-size:.88rem}.cc2-b a,.cc2-b span{display:flex;align-items:flex-start;gap:.5rem;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}.cc2-b a{color:var(--blue)}.cc2-b a:hover{text-decoration:underline}
.cc2-b svg{width:1rem;height:1rem;flex:0 0 auto;margin-top:.1rem;color:var(--muted)}
.cc2-f{display:flex;gap:.35rem;justify-content:flex-end;margin-top:auto;padding-top:.5rem;border-top:1px solid var(--line)}

/* ==========================================================================
   06 · Adaptive layout
   Breakpoints: 1400 (laptop) · 1100 (small laptop / tablet landscape)
                900 (tablet: sidebar becomes a drawer) · 600 (phone) · 380 (small phone)
   ========================================================================== */
@media(max-width:1400px){
  .lvg{grid-template-columns:repeat(2,minmax(0,1fr))}
  body.lv .lvg{grid-template-rows:none;overflow:auto}
  body.lv .main{overflow:auto}
}
@media(max-width:1100px){
  .c-md{display:none}
  .ie{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
}
@media(max-height:760px) and (min-width:901px){
  .nl{padding:.55rem .7rem .15rem}
  .nav{height:2rem}
  .brand{padding:.2rem 0 .6rem}
}
@media(max-height:640px) and (min-width:901px){.nl{display:none}}

/* tablet & below: sidebar becomes an off-canvas drawer */
@media(max-width:900px){
  .app{display:block}
  .side{position:fixed;inset:0 auto 0 0;z-index:70;width:min(300px,86vw);height:100dvh;margin:0;border-radius:0 20px 20px 0;transform:translateX(-104%);transition:transform .25s;padding-bottom:calc(.8rem + var(--safe-b))}
  body.sopen .side{transform:none}
  body.sopen .scrim{display:block}
  #mnb{display:grid}
  .top{margin:.5rem .5rem 0;border-radius:14px}
  .adminbar,.secbar{margin:.4rem .5rem 0}
  .main{padding:.8rem .8rem calc(1.2rem + var(--safe-b))}
  .lvg{grid-template-columns:1fr}
  body.lv .main{overflow:auto;display:block}
  body.lv .fl{display:block}
  body.lv .lvg>.panel{margin-bottom:.8rem;max-height:none}
  .ie{grid-template-columns:1fr;overflow:auto}
  .ie-ph{border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .ie-main{min-height:16rem}
  .ie-f{overflow:visible}
  .mb.xl{height:auto;max-height:96dvh;overflow:auto}
}

/* phones */
@media(max-width:600px){
  .c-sm{display:none}
  .top{flex-wrap:wrap;gap:.45rem}
  .top .sb{order:10;flex:1 1 100%}
  .top .btn.scan span,.top #nwb span{display:none}
  .top .btn.scan,.top #nwb{padding:.5rem .65rem}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:1.1rem}
  .head h1{font-size:1.2rem}
  .head .tools{margin-left:0;justify-content:flex-start;width:100%}
  .two{grid-template-columns:1fr}
  .hero{padding:1rem}.hero h1{font-size:1.25rem}
  .hl{grid-template-columns:repeat(2,1fr)}
  .ov{padding:0;align-items:flex-end}
  .mb{width:100%;max-height:94dvh;border-radius:20px 20px 0 0}
  .mb.xl{width:100%;height:auto;max-height:96dvh}
  .grid,.ie-f .grid.ie-prod{grid-template-columns:1fr}
  .frow{grid-template-columns:minmax(0,1fr) auto;row-gap:.3rem}
  .frow>.acts{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap}
  .fhead{display:none}
  .dc2{min-height:3.8rem;padding:.2rem}
  .evs{flex-direction:row;flex-wrap:wrap}
  .ce{font-size:0;width:.55rem;height:.55rem;padding:0;border:0;border-radius:50%}
  .ce.fit{background:#034ea2}.ce.svc{background:#e08a00}.ce.del{background:#7a4fd0}.ce.hol{background:#12794c}
  .dc2 .more{display:none}
  .wk .dc2{min-height:6rem}
  .ag{grid-template-columns:1fr}
  .hb{grid-template-columns:6rem 1fr 4.5rem}
  .pager{justify-content:center}
  .nc{width:100vw}
  .ie-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  th.ac,td.ac{position:static}
}
@media(max-width:380px){
  html{font-size:12.5px}
  .kpis{grid-template-columns:1fr 1fr;gap:.5rem}
}

/* touch devices: bigger hit areas */
@media(pointer:coarse){
  .mini{height:2.1rem;padding:0 .75rem}
  .chip{padding:.38rem .8rem}
  .nav{height:2.6rem}
  .ptb input[type=checkbox]{width:1.3rem;height:1.3rem}
}
</style>
</head>

<div id="splash"><img class="lg-w" alt="Broadland Windows CRM"></div>

<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="side" aria-label="Main menu">
    <div class="brand"><img class="lg lg-auto" alt="Broadland Windows, Doors &amp; Garden Rooms"></div>
    <nav id="nav"></nav>
    <div class="who">
      <button class="me" id="meBtn" type="button" title="Edit my details" aria-label="Edit my details">
        <span class="av2" id="av"></span>
        <div><b id="whoN"></b><span id="whoR"></span></div>
      </button>
    </div>
    <button class="acct" id="acct" type="button" aria-label="Switch account"></button>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="wrap">
    <!-- ===== Top bar ===== -->
    <header class="top">
      <button class="ib" id="mnb" type="button" aria-label="Open menu"></button>
      <label class="sb" id="sb"><span id="sbIc"></span><input id="q" type="search" placeholder="Search" aria-label="Search" autocomplete="off" maxlength="80"><kbd>/</kbd><button type="button" class="clr" id="qClr" aria-label="Clear search">&times;</button></label>
      <button class="ib" id="bell" type="button" aria-label="Notifications"><span class="bn" id="bellN"></span></button>
      <button class="ib" id="thb" type="button" aria-label="Light or dark mode" title="Light or dark mode"></button>
      <div class="nw">
        <button class="btn" id="nwb" type="button" aria-haspopup="true"></button>
        <div class="menu" id="nwm" role="menu">
          <button data-a="lead" data-v="leads">New lead</button>
          <button data-a="call" data-v="service">New service call</button>
          <button data-a="contact" data-v="contacts">New contact</button>
          <button data-a="stock" data-v="stock">Add stock</button>
          <button data-a="request" data-v="stock">Request stock</button>
          <button data-a="hol" data-v="holidays">Book holiday</button>
          <button data-a="doc" data-v="reports">Guarantee certificate</button>
        </div>
      </div>
      <button class="btn scan" id="scanBtn" type="button"></button>
    </header>
    <div class="adminbar" id="adminbar"></div>
    <div class="secbar" id="secbar"></div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>

<!-- ===== Overlays ===== -->
<div class="ov" id="modal" role="dialog" aria-modal="true"><div class="mb" id="mbox"></div></div>
<div class="ov" id="scanner" role="dialog" aria-modal="true" aria-label="Scan barcode"><div class="mb">
  <h2>Scan Barcode</h2>
  <div class="vwrap"><video id="vid" playsinline muted></video><div class="ret"></div></div>
  <p id="scanMsg" class="muted" style="margin:0"></p>
  <div class="mf"><input id="manual" placeholder="Or type the code" maxlength="64" autocomplete="off"><button class="btn" id="manualGo" type="button">Use code</button></div>
  <div class="mact"><button class="btn ghost" id="scanClose" type="button" style="width:100%">Close</button></div>
</div></div>
<div id="ncbg"></div>
<aside id="nc" class="nc" aria-label="Notification Centre"></aside>
<div class="fpop" id="fpop" role="dialog" aria-label="Sort and filter"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<datalist id="locs"></datalist><datalist id="itemCodes"></datalist>

'use strict';
/* always run over HTTPS when hosted (local files and localhost are left alone) */
if(location.protocol=='http:'&&!/^(localhost|127\.|\[::1\]|0\.0\.0\.0)/.test(location.hostname))location.replace('https://'+location.host+location.pathname+location.search+location.hash);
/* ==========================================================================
   01 · Core helpers: DOM, formatting, dates, validation & escaping
   ========================================================================== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

/* ---- escaping (every piece of data that reaches innerHTML goes through esc) ---- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Safe inline handler: A('openContract',id) -> onclick="openContract(&quot;2402318&quot;)".
   Arguments are JSON-encoded then HTML-escaped, so names/ids containing quotes can't break out. */
const A=(fn,...a)=>`onclick="${esc(fn+'('+a.map(x=>JSON.stringify(x===undefined?null:x)).join(',')+')')}"`;
const AC=(ev,fn,...a)=>`${ev}="${esc(fn+'('+a.map(x=>x==='this'||x==='this.value'||x==='this.checked'?x:JSON.stringify(x===undefined?null:x)).join(',')+')')}"`;

/* ---- validation / sanitising ---- */
const SAFE={
  hex:v=>/^#[0-9a-f]{6}$/i.test(String(v||''))?v:'#c9c6bd',
  img:v=>/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(String(v||''))?v:'',
  url:v=>{try{const u=new URL(String(v||''),location.href);return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}},
  text:(v,max=200)=>String(v??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,'').trim().slice(0,max),
  num:(v,o={})=>{const{min=0,max=1e9,dp=2}=o;let n=parseFloat(v);if(!isFinite(n))return null;n=Math.min(max,Math.max(min,n));const f=10**dp;return Math.round(n*f)/f},
  code:v=>String(v||'').trim().replace(/[^\w\-. /]/g,'').slice(0,64),
  date:v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))&&!isNaN(new Date(v+'T00:00'))?v:'',
  email:v=>/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(String(v||''))
};

/* ---- formatting ---- */
const money=n=>'£'+(+n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>'£'+Math.round(+n||0).toLocaleString('en-GB');
const pad=n=>String(n).padStart(2,'0');
const pc=(a,b)=>b?Math.round(100*a/b)+'%':'0%';
const sum=(a,f)=>a.reduce((x,y)=>x+(+f(y)||0),0);
const grp=(a,f)=>{const m={};a.forEach(x=>{const k=f(x)||'Unknown';(m[k]=m[k]||[]).push(x)});return Object.entries(m)};
const kb=x=>x<1e6?Math.max(1,Math.round(x/1e3))+' KB':(x/1e6).toFixed(1)+' MB';
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ---- dates ---- */
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=n=>{const x=new Date();x.setDate(x.getDate()+n);return iso(x)};
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'Not set';
const fdl=d=>{const x=new Date(d+'T00:00');return isNaN(x)?'':x.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})};
const dslash=v=>v?v.split('-').reverse().join('/'):'';
const nowT=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const isWk=k=>{const g=new Date(k+'T00:00').getDay();return g>0&&g<6};
const wd=(a,b)=>{let n=0;const d=new Date(a+'T00:00'),e=new Date(b+'T00:00');while(d<=e){const g=d.getDay();if(g&&g<6)n++;d.setDate(d.getDate()+1)}return n};
const weekRange=()=>{const n=new Date();n.setHours(0,0,0,0);const a=new Date(n);a.setDate(n.getDate()-((n.getDay()+6)%7));const b=new Date(a);b.setDate(a.getDate()+6);return[iso(a),iso(b)]};
const inWeek=d=>{const[a,b]=weekRange();return d>=a&&d<=b};
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
const BH={'2026-01-01':"New Year's Day",'2026-04-03':'Good Friday','2026-04-06':'Easter Monday','2026-05-04':'Early May bank holiday','2026-05-25':'Spring bank holiday','2026-08-31':'Summer bank holiday','2026-12-25':'Christmas Day','2026-12-28':'Boxing Day (substitute)','2027-01-01':"New Year's Day",'2027-03-26':'Good Friday','2027-03-29':'Easter Monday','2027-05-03':'Early May bank holiday','2027-05-31':'Spring bank holiday','2027-08-30':'Summer bank holiday','2027-12-27':'Christmas Day (substitute)','2027-12-28':'Boxing Day (substitute)'};

/* ---- ids ---- */
const uuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:r&3|8).toString(16)});
const shortId=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* ---- files ---- */
const download=(name,blob)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
/* CSV with formula-injection protection (cells starting = + - @ are prefixed) */
const csvCell=v=>{let s=String(v??'');if(typeof v=='string'&&/^[=+\-@\t\r]/.test(s)&&!/^-?\d+(\.\d+)?$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
const csvDownload=(name,rows)=>download(name,new Blob(['﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
const copyText=t=>{try{navigator.clipboard.writeText(t)}catch(e){}toast('Copied: '+String(t).slice(0,60))};

/* ---- SHA-256 (used for PIN hashes; works offline and on file://) ---- */

    for(let i=0;i<8;i++)H[i]=(H[i]+h[i])|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

function pickRole(k){
  if(!ROLES[k])return;if(k=='staff'||k==ROLE){closeModal();setRole(k);return}
  openModal(`<h2>${esc(ROLES[k].n)} PIN</h2><div class="mf"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" ${AC('onkeydown','pinKey','this')} data-r="${esc(k)}"><button class="btn" ${A('chkPin',k)}>Sign in</button></div><p class="muted" id="pinMsg" style="margin:0"></p><div class="mact"><button class="btn ghost" onclick="swRole()">Back</button></div>`,'sm');
  setTimeout(()=>{const e=$('#pin');e&&e.focus()},50)}
function pinKey(el){if(event.key=='Enter')chkPin(el.dataset.r)}
function pinState(){try{return JSON.parse(sessionStorage.getItem('bb_pin'))||{n:0,until:0}}catch(e){return{n:0,until:0}}}
function chkPin(k){
  const st=pinState(),wait=Math.ceil((st.until-Date.now())/1000);
  if(wait>0){$('#pinMsg').textContent='Too many wrong PINs. Try again in '+wait+' seconds.';return}
  const v=$('#pin').value;
  if(S.sec.pins[k]&&pinHash(k,v)===S.sec.pins[k].h){try{sessionStorage.removeItem('bb_pin')}catch(e){}closeModal();setRole(k);audit('Signed in',ROLES[k].n,'');store();
    if(S.sec.pins[k].def&&ISOWN())setTimeout(()=>toast('This account still uses the default PIN. Change it in Admin console.'),800);return}
  st.n++;if(st.n>=PIN_TRIES){st.until=Date.now()+PIN_LOCK_S*1000;st.n=0;audit('PIN locked',ROLES[k].n,PIN_TRIES+' wrong attempts');store()}
  try{sessionStorage.setItem('bb_pin',JSON.stringify(st))}catch(e){}
  $('#pin').value='';$('#pinMsg').textContent=st.until>Date.now()?'Locked for '+PIN_LOCK_S+' seconds.':'Wrong PIN, '+(PIN_TRIES-st.n)+' tries left.'}
function setRole(r){
  ROLE=r;try{sessionStorage.setItem('bb_role',r);sessionStorage.setItem('bb_role_at',Date.now())}catch(e){}
  if(pendView&&canSee(pendView)&&(pendView!='admin'||ISOWN()))view=pendView;pendView=null;
  if(!canSee(view)||(view=='admin'&&!ISOWN()))view=HOME();
  render();toast('Signed in as '+ROLES[r].n)}

/* ---- PIN management (owner accounts) ---- */
function chPin(){
  if(!need(ISOWN,'Changing PINs'))return;
  openModal(`<h2>Account PINs</h2><p class="muted">PINs are stored as salted SHA-256 hashes. Use 4 to 12 digits.</p>${Object.entries(ROLES).filter(([k])=>k!='staff').map(([k,r])=>`<div class="row"><span><b>${esc(r.n)}</b><br><span class="muted">${S.sec.pins[k].def?'<span class="tag y">Default PIN</span>':'Custom PIN set'}</span></span><button class="mini pri" ${A('setPin',k)}>Change</button></div>`).join('')}<div class="mact"><button class="btn" onclick="closeModal()">Done</button></div>`)}
function setPin(k){
  if(!need(ISOWN,'Changing PINs'))return;
  form('New PIN: '+ROLES[k].n,[{k:'a',l:'New PIN',t:'password',req:1,max:12},{k:'b',l:'Repeat new PIN',t:'password',req:1,max:12}],{},o=>{
    if(!/^\d{4,12}$/.test(o.a)){toast('Use 4 to 12 digits');return false}
    if(o.a!==o.b){toast('The PINs do not match');return false}
    if(o.a=='1234'||/^(\d)\1+$/.test(o.a)){toast('Pick a PIN that is harder to guess');return false}
    S.sec.pins[k]={h:pinHash(k,o.a),def:0};audit('PIN changed',ROLES[k].n,'');setTimeout(chPin,50)})}

function saveProfile(){
  const v=i=>SAFE.text(($('#'+i)||{}).value,i=='p_sig'?400:120),p=S.profile,m=me();
  const name=v('p_name');if(name.length<2){toast('Please enter your name');return}
  const em=v('p_email');if(em&&!SAFE.email(em)){toast('That email address does not look right');return}
  const old=p.name;Object.assign(p,{name,email:em,phone:v('p_phone'),mobile:v('p_mobile'),emergency:v('p_emer'),signature:v('p_sig')});
  if(m){p.sid=m.id;Object.assign(m,{name,email:em||m.email,phone:p.phone||m.phone});
    if(ISOWN()){m.role=v('p_role')||m.role;m.team=v('p_team')=='None'?'':v('p_team');m.start=SAFE.date(v('p_start'))||m.start;const al=SAFE.num(v('p_allow'),{max:60,dp:0});if(al!=null)m.allow=al}}
  if(old!=name){/* keep authored records pointing at the new name */S.items.forEach(r=>{if(r.user==old)r.user=name});(S.notes||[]).forEach(n=>{if(n.to==old)n.to=name;if(n.by==old)n.by=name})}
  audit('Profile updated',name,old!=name?'Renamed from '+old:'');store();closeModal();render();toast('Your details are saved')}

/* ---- generic form ----
   field: {k,l,t:text|number|date|select|area|colour|password|email|tel, o:[options], req, pos, ro, w:'full', scan, list, max, min, dp, hint} */
let tmp=null,tmpDraw=null;
function form(title,fields,v,cb,photos,size){
  v=v||{};tmp=photos?(v.photos||[]).filter(SAFE.img).slice():null;tmpDraw=drawThumbs;
  const sel=f=>{const cur=v[f.k]??'',has=f.o.some(o=>String(Array.isArray(o)?o[0]:o)==String(cur));return `<select id="f_${f.k}" ${f.ro?'disabled':''}>${(cur!==''&&!has?[cur,...f.o]:f.o).map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o||'-'];return `<option value="${esc(val)}"${String(val)==String(v[f.k]??'')?' selected':''}>${esc(lab)}</option>`}).join('')}</select>`};
  const inp=f=>f.t=='colour'?colourField(f,v):f.t=='select'?sel(f):f.t=='area'?`<textarea id="f_${f.k}" rows="3" maxlength="${f.max||2000}">${esc(v[f.k]||'')}</textarea>`
    :`<input id="f_${f.k}" type="${f.t||'text'}"${f.t=='number'?` step="any" min="${f.min??0}"${f.max?` max="${f.max}"`:''} inputmode="decimal"`:` maxlength="${f.max||120}"`} value="${esc(v[f.k]??'')}"${f.ro?' readonly':''}${f.list?` list="${f.list}"`:''} autocomplete="off">`;
  openModal(`<h2>${esc(title)}</h2><div class="grid">${fields.map(f=>`<div class="ff ${f.w||''}"><label for="f_${f.k}">${esc(f.l)}${f.req?' *':''}</label>${f.scan?`<div class="inl">${inp(f)}<button type="button" class="btn scan sm" ${A('scanInto','f_'+f.k)}>Scan</button></div>`:inp(f)}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`).join('')}
   ${photos?`<div class="ff full"><label>Photos <span class="muted">(up to ${MAX_PHOTOS})</span></label><div class="thumbs" id="thumbs"></div><div class="prow"><label class="btn ghost sm">Take photo<input type="file" accept="image/*" capture="environment" hidden onchange="addPh(this)"></label><label class="btn ghost sm">Choose from gallery<input type="file" accept="image/*" multiple hidden onchange="addPh(this)"></label></div></div>`:''}</div>
   <div class="mact"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="saveBtn">Save changes</button></div>`,size);
  if(photos)drawThumbs();
  $('#saveBtn').onclick=()=>{const o=readFields(fields);if(!o)return;if(photos)o.photos=tmp;if(cb(o)===false)return;store();closeModal();render()}}
/* read + validate form fields; returns null (and focuses the field) when invalid */
function readFields(fields){const o={};
  for(const f of fields){const e=$('#f_'+f.k);if(!e)continue;const raw=(e.value||'').trim(),lab=f.l.replace(/ \(.*\)/,'');
    if(f.req&&!raw){toast(lab+' is required');e.focus();return null}
    if(f.t=='number'){if(raw===''){o[f.k]=0;continue}const n=SAFE.num(raw,{min:f.min??0,max:f.max??1e9,dp:f.dp??2});if(n==null||(f.pos&&!(n>0))){toast(lab+' must be a '+(f.pos?'positive ':'')+'number');e.focus();return null}if(parseFloat(raw)!=n&&(parseFloat(raw)<(f.min??0)||parseFloat(raw)>(f.max??1e9))){toast(lab+' must be between '+(f.min??0)+' and '+(f.max??1e9));e.focus();return null}o[f.k]=n}
    else if(f.t=='date'){if(raw&&!SAFE.date(raw)){toast(lab+' is not a valid date');e.focus();return null}o[f.k]=raw}
    else if(f.t=='email'){if(raw&&!SAFE.email(raw)){toast(lab+' does not look like an email address');e.focus();return null}o[f.k]=raw}
    else o[f.k]=SAFE.text(raw,f.t=='area'?(f.max||2000):(f.max||120));
    if(f.t=='colour')o[f.k+'Hex']=raw?SAFE.hex($('#f_'+f.k+'_hex').value):'';}
  return o}
function colourField(f,v){const base=f.k.slice(0,-4),hx=SAFE.hex(v[base]||'#8a8a8a');
  return `<div class="inl"><input id="f_${f.k}" placeholder="Colour name (optional)" maxlength="30" value="${esc(v[f.k]??'')}"><input type="hidden" id="f_${f.k}_hex" value="${hx}"><button type="button" class="cbtn" id="cb_${f.k}" style="background:${hx}" title="Pick a colour" aria-label="Pick a colour" ${A('cpOpen',f.k)}></button></div><div class="sws"><button type="button" class="mini" ${A('pickC',f.k,'','#8a8a8a')}>No Colour</button>${PRE.map(([n,h])=>`<button type="button" class="sw" title="${n}" aria-label="${n}" style="background:${h}" ${A('pickC',f.k,n,h)}></button>`).join('')}</div>`}
function pickC(k,n,h){$('#f_'+k).value=n;$('#f_'+k+'_hex').value=h;const b=$('#cb_'+k);if(b)b.style.background=h}
function pickHex(k){const e=$('#f_'+k);if(!e.value)e.value='Custom'}

  p.style.left=Math.max(8,Math.min(innerWidth-p.offsetWidth-8,b.right-p.offsetWidth))+'px';p.style.top=Math.max(8,Math.min(innerHeight-p.offsetHeight-8,b.bottom+8))+'px';
  const sv=$('#cpSv'),drag=e=>{const r=sv.getBoundingClientRect();CP.s=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));CP.v=1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));cpDraw(true)};

function cpDraw(setHex){const hx=hsv2hex(CP.h,CP.s,CP.v),sv=$('#cpSv');if(!sv)return;if(setHex)CP.ral=ralNear(hx);sv.style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(${CP.h},100%,50%))`;

function drawThumbs(){const t=$('#thumbs');if(!t)return;t.innerHTML=tmp.map((p,i)=>`<div class="th"><img src="${SAFE.img(p)}" alt="Photo ${i+1}"><button type="button" aria-label="Remove photo" ${A('rmPh',i)}>&times;</button></div>`).join('')||'<span class="muted">No photos yet.</span>'}

function addPh(inp){const files=[...inp.files].filter(f=>/^image\//.test(f.type));inp.value='';
  const room=MAX_PHOTOS-tmp.length;if(room<=0){toast('Up to '+MAX_PHOTOS+' photos per record');return}
  if(files.length>room)toast('Only the first '+room+' photo'+(room>1?'s':'')+' were added (limit '+MAX_PHOTOS+')');
  files.slice(0,room).forEach(f=>{if(f.size>25e6){toast(f.name+' is too large');return}const img=new Image();
    img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);tmp.push(c.toDataURL('image/jpeg',.7));URL.revokeObjectURL(img.src);tmpDraw&&tmpDraw()};
    img.onerror=()=>toast('That file could not be read as an image');img.src=URL.createObjectURL(f)})}

function paginate(st,rows){const per=+st.per||0,pages=per>0?Math.max(1,Math.ceil(rows.length/per)):1;st.page=Math.min(Math.max(1,st.page||1),pages);const s=per>0?(st.page-1)*per:0;
  return{rows:per>0?rows.slice(s,s+per):rows,from:rows.length?s+1:0,to:per>0?Math.min(rows.length,s+per):rows.length,total:rows.length,pages}}
function pagerH(key,p,label){const st=UI[key];if(!p.total)return'';
  const nums=[];for(let i=1;i<=p.pages;i++)if(i==1||i==p.pages||Math.abs(i-st.page)<=1)nums.push(i);else if(nums[nums.length-1]!='…')nums.push('…');

function parseHM(txt){const t=String(txt).replace(/\s+/g,' ').slice(0,2e6),out=[];out.pageTotal=+((t.match(/\bJobs\s+(\d+)/)||[])[1]||0)||null;
  t.split(/Job:\s*/).slice(1).forEach(b=>{const g=re=>{const m=b.match(re);return m&&m[1]?m[1].trim():''},job=SAFE.code(b.split(' ')[0]),ref=SAFE.text(g(/Ref:\s*(.*?)\s+Desc:/),80),desc=SAFE.text(g(/Desc:\s*(.*?)\s+Orig\. Load Date:/),120),load=g(/(?<!Orig\. )Load Date:\s*(\d{2}\/\d{2}\/\d{4})/),pod=/POD Link:\s*Click Here/i.test(b),ms=[];

const csvP=(t,d)=>{const r=[];let row=[],c='',qq=0;for(let i=0;i<t.length;i++){const x=t[i];if(qq){if(x=='"'&&t[i+1]=='"'){c+='"';i++}else if(x=='"')qq=0;else c+=x}else if(x=='"')qq=1;else if(x==d){row.push(c);c=''}else if(x=='\n'||x=='\r'){if(x=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=x}row.push(c);r.push(row);return r.filter(r=>r.some(v=>v.trim()))};

function absCode(s,k){const m=(S.abs[s.id]||{})[k];if(m!==undefined)return m;if(!isWk(k))return '';if(BH[k])return 'B';
  const h=S.hols.find(h=>h.sid==s.id&&h.status!='Rejected'&&h.from<=k&&h.to>=k);if(h)return h.status=='Approved'?'H':'P';
  return shutDays(+k.slice(0,4)).includes(k)?'H':''}
function yearCounts(s,y){const c={},d=new Date(y,0,1);while(d.getFullYear()==y){const x=absCode(s,iso(d));if(x&&HC[x])c[x]=(c[x]||0)+1;d.setDate(d.getDate()+1)}return c}

  const m=S.abs[sid]=S.abs[sid]||{},before=absCode(s,k);if(v==before)return true;

/* ---- uploads (IndexedDB) ---- */
const MAX_UPLOAD=50e6, OK_TYPES=/^(application\/pdf|image\/|text\/plain|text\/csv|application\/(msword|vnd\.openxmlformats|vnd\.ms-excel|zip))/;
const idb=()=>new Promise((s,j)=>{const r=indexedDB.open('bb_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>s(r.result);r.onerror=()=>j(r.error)});
const fx=async(m,f)=>{const d=await idb();return new Promise((s,j)=>{const t=d.transaction('f',m),o=f(t.objectStore('f'));t.oncomplete=()=>s(o&&o.result);t.onerror=()=>j(t.error)})};
let MF=[];
async function manUp(inp,cat){const c=MC.includes(cat)||cat=='Brand Asset'?cat:($('#mcat')||{}).value||'Other';let n=0,skip=[];
  try{for(const f of inp.files){if(f.size>MAX_UPLOAD||(f.type&&!OK_TYPES.test(f.type))){skip.push(f.name);continue}await fx('readwrite',s=>s.put({id:uuid(),name:SAFE.text(f.name,120),cat:c,size:f.size,type:f.type,time:Date.now(),by:USER,blob:f}));n++}
    inp.value='';if(n){audit('File uploaded',c,n+' file(s)');store()}toast(n+' uploaded'+(skip.length?', skipped '+skip.length+' (type or size not allowed)':''));loadMan()}catch(e){toast('File storage is not available here')}}
function manDl(id){const f=MF.find(x=>x.id==id);if(f)download(f.name,f.blob)}
function manOpen(id){const f=MF.find(x=>x.id==id);if(!f)return;/* only open types the browser can show safely; everything else downloads */if(/^(application\/pdf|image\/(png|jpe?g|gif|webp)|text\/plain)/.test(f.blob.type)){window.open(URL.createObjectURL(f.blob),'_blank','noopener')}else manDl(id)}
function manDel(id){const f=MF.find(x=>x.id==id);if(!f)return;askYes('Delete '+f.name+'?','This removes the file from this device for good. It cannot be undone.','Delete file',()=>manDelGo(id),true)}
async function manDelGo(id){const f=MF.find(x=>x.id==id);if(!f)return;await fx('readwrite',s=>s.delete(id));audit('File deleted',f.name,'');store();loadMan()}
async function manRen(id){const f=MF.find(x=>x.id==id);if(!f)return;const n=SAFE.text(prompt('Rename file',f.name),120);if(!n)return;f.name=n;await fx('readwrite',s=>s.put(f));loadMan()}
async function loadMan(){const m=$('#mans'),a=$('#assets');if(!m&&!a)return;
  try{MF=((await fx('readonly',s=>s.getAll()))||[]).filter(f=>!f.ref).sort((x,y)=>y.time-x.time);
    const row=f=>`<div class="frow"><b>${esc(f.name)}</b><span class="tag">${esc(tc(f.cat))}</span><span class="sz">${kb(f.size)}</span><span class="acts"><button class="mini pri" ${A('manDl',f.id)}>Download</button><button class="mini" ${A('manOpen',f.id)}>Open</button><button class="mini" ${A('manRen',f.id)}>Rename</button><button class="mini del" ${A('manDel',f.id)}>Delete</button></span></div>`;
    const fl=f=>!q||(f.name+' '+f.cat).toLowerCase().includes(q);
    if(m)m.innerHTML=MF.filter(f=>!/^brand asset$/i.test(f.cat)&&fl(f)).map(row).join('')||emptyArt('files','No files yet. Upload manuals, fitting guides, spec sheets and anything else the team needs.');
    if(a)a.innerHTML=BUILTIN().filter(b=>!(S.fileHide||{})['asset:'+b.key]).filter(fl).map(b=>`<div class="frow"><b>${esc(b.name)}</b><span class="tag g">Built-in</span><span class="sz">${kb(b.size)}</span><span class="acts"><a class="mini pri" href="${esc(b.src)}" download="${esc(b.file)}">Download</a><button class="mini" ${A('builtinOpen',b.key)}>Open</button>${ISOWN()?`<button class="mini del" ${A('fileHide','asset:'+b.key,b.name)}>Remove</button>`:''}</span></div>`).join('')+(MF.filter(f=>/^brand asset$/i.test(f.cat)&&fl(f)).map(row).join('')||'<p class="empty" style="margin-top:.6rem">No uploaded brand or print assets yet. Upload cards and artwork above.</p>')}
  catch(e){[m,a].forEach(el=>el&&(el.innerHTML='<p class="empty">File storage is not available in this browser.</p>'))}}

function backupLoad(inp){if(!need(ISOWN,'Restoring backups'))return;const f=inp.files[0];inp.value='';if(!f)return;if(f.size>20e6){toast('That file is too large');return}
  f.text().then(t=>{let n;try{n=JSON.parse(t)}catch(e){toast('That is not a valid backup file');return}
    const ok=n&&typeof n=='object'&&['items','leads','contracts','calls','staff'].every(k=>Array.isArray(n[k]));if(!ok){toast('That file is not a Broadland CRM backup');return}
    if(!confirm('Replace ALL current data with this backup? Your current data is kept as a safety copy in this browser.'))return;
    try{localStorage.setItem(KEY+'_before_restore',JSON.stringify(S))}catch(e){}
    n.sec=S.sec;delete n.__proto__;delete n.constructor;/* a backup never brings its own PINs */
    try{localStorage.setItem(KEY,JSON.stringify(n))}catch(e){toast('Not enough browser storage to restore');return}
    location.reload()})}

function ncData(){const td=today(),req=[],mov=[],alr=[];
  const Ad=ISADM();S.items.forEach(r=>{if(r.type=='request'){if(['Pending','Approved'].includes(r.reqStatus)&&!r.cleared&&(Ad||r.user==USER))req.push(r)}else if(Ad){mov.push({r,n:!S.seen[r.uid]});if(r.flag&&!r.cleared)alr.push({k:'Alert',t:r.item+': '+r.type+' '+r.qty,s:r.user+', '+r.time,uid:r.uid})}});

  S.contracts.filter(c=>fensaDue(c)&&c.fit&&c.fit<=addDays(-14)).forEach(c=>{const g=Math.round((new Date(td)-new Date(c.fit))/864e5);alr.push({k:'FENSA',t:c.name+' #'+c.id,s:'Fitted '+g+' days ago. Notify FENSA within 30 days of fitting.',go:'contracts'})});

function ncAct(a,x){
  if(a=='approve'){reqApprove(x);return}if(a=='reject'){reqReject(x);return}
  if(a=='receive'){ncToggle(false);reqReceive(x);return}if(a=='go'){ncToggle(false);go(x);return}
  if(a=='clr')moveClear(x);
  else if(a=='alr'){const q=ncAlerts[x];if(!q)return;if(q.uid){const r=byUid(q.uid);if(r){r.cleared=true;r.flag=false}}else if(q.key)S.dis[q.key]=q.stock}
  else if(a=='read'){const n=S.notes.find(n=>n.id==x);if(n)n.read=true}
  else if(a=='del')S.notes=S.notes.filter(n=>n.id!=x);
  else if(a=='readall'){ncData().mov.forEach(m=>S.seen[m.r.uid]=1);S.notes.forEach(n=>{if(n.to==USER)n.read=true})}
  else if(a=='clrall'){const d=ncData(),T=UI.nc.t,all=T=='All';
    if(all||T=='Requests')d.req.filter(r=>r.reqStatus!='Pending').forEach(r=>{r.cleared=true;r.reqStatus='Cleared'});
    if(all||T=='Alerts')d.alr.forEach(q=>{if(q.uid){const r=byUid(q.uid);if(r){r.cleared=true;r.flag=false}}else if(q.key)S.dis[q.key]=q.stock});
    if(all||T=='Mentions')S.notes=S.notes.filter(n=>n.to!=USER);
    if(all||T=='Stock In/Out')d.mov.forEach(m=>S.seen[m.r.uid]=1)}
  /* keep the seen-list from growing forever */
  const keep=new Set(S.items.map(r=>r.uid));Object.keys(S.seen).forEach(k=>{if(!keep.has(k))delete S.seen[k]});
  store();render()}
